name: Test National Highways Importer

on:
  workflow_dispatch:

jobs:
  test-national-highways-importer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run National Highways Test 5
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pprint import pprint

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"

          MAX_REQUESTS = 5


          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          params = {
              "startDateTime": START,
              "endDateTime": END,
          }


          print("=" * 80)
          print("NATIONAL HIGHWAYS TEST 5")
          print("RAW D2PAYLOAD INSPECTION")
          print("=" * 80)
          print()
          print("Purpose:")
          print(
              "Inspect the actual raw D2Payload structure returned by "
              "the National Highways closures endpoint."
          )
          print()
          print("closureType: NOT supplied")
          print("Pagination: NOT followed")
          print("Request splitting: NOT used")
          print("Production importer: NOT used")
          print("Database: NOT modified")
          print()
          print(f"Start: {START}")
          print(f"End:   {END}")
          print()


          for request_number in range(
              1,
              MAX_REQUESTS + 1,
          ):

              print("=" * 80)
              print(
                  f"REQUEST ATTEMPT {request_number}/{MAX_REQUESTS}"
              )
              print("=" * 80)
              print()

              print("URL:")
              print(API_URL)
              print()

              print("Parameters:")
              pprint(params)
              print()

              print("Sending request...")
              print()

              response = requests.get(
                  API_URL,
                  params=params,
                  headers=headers,
                  timeout=60,
              )

              print(
                  "HTTP STATUS:",
                  response.status_code,
              )
              print()

              # --------------------------------------------------------
              # Rate limiting
              # --------------------------------------------------------

              if response.status_code == 429:

                  retry_after = response.headers.get(
                      "Retry-After"
                  )

                  print("=" * 80)
                  print("HTTP 429 RATE LIMIT")
                  print("=" * 80)
                  print()

                  print(
                      "Retry-After:",
                      retry_after or "NOT SUPPLIED",
                  )
                  print()

                  if not retry_after:
                      raise RuntimeError(
                          "HTTP 429 received without "
                          "Retry-After header."
                      )

                  try:
                      wait_seconds = int(
                          retry_after
                      )
                  except ValueError:
                      raise RuntimeError(
                          "Invalid Retry-After value: "
                          f"{retry_after}"
                      )

                  if request_number >= MAX_REQUESTS:
                      raise RuntimeError(
                          "Maximum Test 5 request attempts reached "
                          "after receiving HTTP 429."
                      )

                  print(
                      f"Waiting {wait_seconds} seconds "
                      "before retrying the same request..."
                  )
                  print()

                  time.sleep(
                      max(
                          0,
                          wait_seconds,
                      )
                  )

                  continue


              # --------------------------------------------------------
              # All non-200 responses fail immediately.
              # --------------------------------------------------------

              if response.status_code != 200:

                  print("=" * 80)
                  print("API REQUEST FAILED")
                  print("=" * 80)
                  print()

                  print("Response headers:")
                  pprint(
                      dict(
                          response.headers
                      )
                  )
                  print()

                  print("Response body:")
                  print(
                      response.text[:10000]
                  )
                  print()

                  raise RuntimeError(
                      "National Highways API returned "
                      f"HTTP {response.status_code}"
                  )


              # --------------------------------------------------------
              # Successful response
              # --------------------------------------------------------

              print("=" * 80)
              print("SUCCESSFUL API RESPONSE")
              print("=" * 80)
              print()

              print("Response headers:")
              pprint(
                  dict(
                      response.headers
                  )
              )
              print()

              try:
                  payload = response.json()
              except Exception as exc:
                  print(
                      "Raw response body:"
                  )
                  print(
                      response.text[:10000]
                  )
                  print()

                  raise RuntimeError(
                      "Response was not valid JSON."
                  ) from exc

              break

          else:
              raise RuntimeError(
                  "Test 5 exhausted all request attempts."
              )


          # ============================================================
          # TOP LEVEL
          # ============================================================

          print("=" * 80)
          print("RAW RESPONSE STRUCTURE")
          print("=" * 80)
          print()

          print("Top-level Python type:")
          print(
              type(payload).__name__
          )
          print()

          if not isinstance(
              payload,
              dict,
          ):
              print("Raw payload:")
              print(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  )
              )

              raise RuntimeError(
                  "Top-level JSON object was not a dictionary."
              )

          print("Top-level keys:")
          pprint(
              list(
                  payload.keys()
              )
          )
          print()


          # ============================================================
          # D2Payload
          # ============================================================

          print("=" * 80)
          print("D2Payload")
          print("=" * 80)
          print()

          d2payload = payload.get(
              "D2Payload"
          )

          print("D2Payload type:")
          print(
              type(d2payload).__name__
          )
          print()

          if not isinstance(
              d2payload,
              dict,
          ):

              print("D2Payload:")
              print(
                  json.dumps(
                      d2payload,
                      indent=2,
                      ensure_ascii=False,
                  )
              )

              raise RuntimeError(
                  "D2Payload was not a dictionary."
              )

          print("D2Payload keys:")
          pprint(
              list(
                  d2payload.keys()
              )
          )
          print()


          # ============================================================
          # SITUATIONS
          # ============================================================

          situations = d2payload.get(
              "situation",
              []
          )

          print("=" * 80)
          print("D2Payload.situation[]")
          print("=" * 80)
          print()

          print("Type:")
          print(
              type(situations).__name__
          )

          print("Count:")
          print(
              len(situations)
          )
          print()

          if not isinstance(
              situations,
              list,
          ):
              raise RuntimeError(
                  "D2Payload.situation was not a list."
              )


          # ============================================================
          # RAW RECORD INSPECTION
          # ============================================================

          MAX_SITUATIONS = 5
          MAX_RECORDS_PER_SITUATION = 5

          total_records_seen = 0


          for situation_index, situation in enumerate(
              situations[
                  :MAX_SITUATIONS
              ],
              start=1,
          ):

              print("=" * 80)
              print(
                  f"SITUATION {situation_index}"
              )
              print("=" * 80)
              print()

              if not isinstance(
                  situation,
                  dict,
              ):

                  print(
                      "Unexpected situation type:"
                  )
                  print(
                      type(situation).__name__
                  )
                  print()

                  pprint(
                      situation
                  )

                  continue


              print("Situation keys:")
              pprint(
                  list(
                      situation.keys()
                  )
              )
              print()


              records = situation.get(
                  "situationRecord",
                  []
              )

              print(
                  "situationRecord type:"
              )
              print(
                  type(records).__name__
              )

              print(
                  "situationRecord count:"
              )
              print(
                  len(records)
              )
              print()


              if not isinstance(
                  records,
                  list,
              ):
                  continue


              for record_index, record in enumerate(
                  records[
                      :MAX_RECORDS_PER_SITUATION
                  ],
                  start=1,
              ):

                  total_records_seen += 1

                  print("-" * 80)
                  print(
                      f"SITUATION {situation_index} "
                      f"/ RECORD {record_index}"
                  )
                  print("-" * 80)
                  print()


                  if not isinstance(
                      record,
                      dict,
                  ):

                      print(
                          "Unexpected record type:"
                      )
                      print(
                          type(record).__name__
                      )
                      print()

                      pprint(
                          record
                      )

                      continue


                  # ----------------------------------------------------
                  # Complete raw record
                  # ----------------------------------------------------

                  print("FULL RAW RECORD:")
                  print()

                  print(
                      json.dumps(
                          record,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()


                  # ----------------------------------------------------
                  # Record keys
                  # ----------------------------------------------------

                  print("RECORD KEYS:")
                  pprint(
                      list(
                          record.keys()
                      )
                  )
                  print()


                  # ----------------------------------------------------
                  # Important top-level fields
                  # ----------------------------------------------------

                  print(
                      "IMPORTANT TOP-LEVEL FIELDS:"
                  )
                  print()

                  for field in (
                      "idG",
                      "situationRecordType",
                      "recordVersion",
                      "recordVersionTime",
                      "situationRecordCreationTime",
                      "situationRecordObservationTime",
                      "situationRecordStatus",
                      "overallSeverity",
                      "probabilityOfOccurrence",
                  ):

                      if field in record:

                          print(
                              f"{field}:"
                          )

                          print(
                              json.dumps(
                                  record[field],
                                  indent=2,
                                  ensure_ascii=False,
                              )
                          )

                          print()


                  # ----------------------------------------------------
                  # Validity
                  # ----------------------------------------------------

                  validity = record.get(
                      "validity"
                  )

                  if validity is None:

                      management = record.get(
                          "sitRoadOrCarriagewayOrLaneManagement",
                          {}
                      )

                      if isinstance(
                          management,
                          dict,
                      ):

                          validity = management.get(
                              "validity"
                          )


                  print("=" * 80)
                  print("VALIDITY")
                  print("=" * 80)
                  print()

                  print(
                      json.dumps(
                          validity,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()


                  if isinstance(
                      validity,
                      dict,
                  ):

                      print(
                          "validityTimeSpecification:"
                      )

                      print(
                          json.dumps(
                              validity.get(
                                  "validityTimeSpecification"
                              ),
                              indent=2,
                              ensure_ascii=False,
                          )
                      )

                      print()


                  # ----------------------------------------------------
                  # Location reference
                  # ----------------------------------------------------

                  location_reference = record.get(
                      "locationReference"
                  )

                  if location_reference is None:

                      management = record.get(
                          "sitRoadOrCarriagewayOrLaneManagement",
                          {}
                      )

                      if isinstance(
                          management,
                          dict,
                      ):

                          location_reference = (
                              management.get(
                                  "locationReference"
                              )
                          )


                  print("=" * 80)
                  print("LOCATION REFERENCE")
                  print("=" * 80)
                  print()

                  print(
                      json.dumps(
                          location_reference,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()


                  # ----------------------------------------------------
                  # Road management
                  # ----------------------------------------------------

                  management = record.get(
                      "sitRoadOrCarriagewayOrLaneManagement"
                  )

                  print("=" * 80)
                  print(
                      "ROAD / CARRIAGEWAY MANAGEMENT"
                  )
                  print("=" * 80)
                  print()

                  print(
                      json.dumps(
                          management,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()


          # ============================================================
          # FINAL SUMMARY
          # ============================================================

          print("=" * 80)
          print("TEST 5 SUMMARY")
          print("=" * 80)
          print()

          print(
              "Successful API request: YES"
          )

          print(
              "closureType supplied: NO"
          )

          print(
              "Pagination followed: NO"
          )

          print(
              "Records inspected in detail:",
              total_records_seen,
          )

          print()

          print(
              "The GitHub Actions log is the "
              "authoritative Test 5 output."
          )

          print()

          print(
              "No production importer was modified."
          )

          print(
              "No database was modified."
          )

          print("=" * 80)

          PY
