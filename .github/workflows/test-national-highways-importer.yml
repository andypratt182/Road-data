name: Test National Highways Importer

on:
  workflow_dispatch:

jobs:
  test-national-highways-importer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run National Highways Test 5 - raw payload inspection
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          from pprint import pprint
          import os
          import requests

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"

          print("=" * 70)
          print("NATIONAL HIGHWAYS TEST 5 - RAW PAYLOAD INSPECTION")
          print("=" * 70)
          print()
          print("One raw API request.")
          print("closureType: NOT supplied")
          print(f"Start: {START}")
          print(f"End:   {END}")
          print()
          print("This test deliberately bypasses the normalised importer")
          print("processing so that the actual D2Payload structure can")
          print("be inspected.")
          print()

          api_key = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          if not api_key:
              raise RuntimeError(
                  "NATIONAL_HIGHWAYS_API_KEY is not configured."
              )

          url = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          params = {
              "startDateTime": START,
              "endDateTime": END,
          }

          # Use the exact authentication and DATEX II headers
          # used by the existing working National Highways parser.
          headers = {
              "Ocp-Apim-Subscription-Key": api_key,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          print("Request URL:")
          print(url)
          print()

          print("Request parameters:")
          pprint(params)
          print()

          print("Sending request...")

          response = requests.get(
              url,
              params=params,
              headers=headers,
              timeout=60,
          )

          print()
          print("HTTP STATUS:", response.status_code)
          print()

          if response.status_code != 200:
              print("RESPONSE HEADERS:")
              pprint(dict(response.headers))
              print()
              print("RESPONSE BODY:")
              print(response.text[:5000])
              print()

          response.raise_for_status()

          payload = response.json()

          print("=" * 70)
          print("RAW TOP-LEVEL STRUCTURE")
          print("=" * 70)

          if isinstance(payload, dict):
              print("Top-level keys:")
              pprint(list(payload.keys()))
          else:
              print("Unexpected payload type:")
              print(type(payload).__name__)

          print()

          d2_payload = (
              payload.get("D2Payload", {})
              if isinstance(payload, dict)
              else {}
          )

          print("D2Payload type:")
          print(type(d2_payload).__name__)
          print()

          if not isinstance(d2_payload, dict):
              raise RuntimeError(
                  "D2Payload is not a dictionary."
              )

          print("D2Payload keys:")
          pprint(list(d2_payload.keys()))
          print()

          situations = d2_payload.get(
              "situation",
              []
          )

          print("Situation type:")
          print(type(situations).__name__)

          print("Situation count:")
          print(len(situations))

          print()

          if not isinstance(situations, list):
              raise RuntimeError(
                  "D2Payload.situation is not a list."
              )

          # ------------------------------------------------------------
          # Inspect the first three situations.
          # ------------------------------------------------------------

          for situation_number, situation in enumerate(
              situations[:3],
              start=1,
          ):

              print("=" * 70)
              print(f"SITUATION {situation_number}")
              print("=" * 70)

              if not isinstance(situation, dict):
                  print(
                      "Unexpected situation type:",
                      type(situation).__name__,
                  )
                  print()
                  continue

              print("Situation keys:")
              pprint(list(situation.keys()))
              print()

              records = situation.get(
                  "situationRecord",
                  []
              )

              print("situationRecord type:")
              print(type(records).__name__)

              print("situationRecord count:")
              print(len(records))

              print()

              if not isinstance(records, list):
                  print(
                      "Unexpected situationRecord type:",
                      type(records).__name__,
                  )
                  print()
                  continue

              # --------------------------------------------------------
              # Inspect the first three records from each situation.
              # --------------------------------------------------------

              for record_number, record in enumerate(
                  records[:3],
                  start=1,
              ):

                  print("-" * 70)
                  print(
                      f"RAW situationRecord {record_number}"
                  )
                  print("-" * 70)

                  if not isinstance(record, dict):
                      print(
                          "Unexpected record type:",
                          type(record).__name__,
                      )
                      print()
                      continue

                  print("Record keys:")
                  pprint(list(record.keys()))
                  print()

                  print("FULL RAW RECORD:")
                  pprint(
                      record,
                      sort_dicts=False,
                      width=160,
                  )
                  print()

                  # ----------------------------------------------------
                  # Inspect the structure expected by data_processor.py
                  # ----------------------------------------------------

                  management = record.get(
                      "sitRoadOrCarriagewayOrLaneManagement",
                      {},
                  )

                  print("MANAGEMENT TYPE:")
                  print(type(management).__name__)
                  print()

                  if not isinstance(
                      management,
                      dict,
                  ):
                      print(
                          "Unexpected management structure."
                      )
                      print()
                      continue

                  print("MANAGEMENT KEYS:")
                  pprint(list(management.keys()))
                  print()

                  # ----------------------------------------------------
                  # VALIDITY
                  # ----------------------------------------------------

                  validity = management.get(
                      "validity",
                      {},
                  )

                  print("VALIDITY:")
                  pprint(
                      validity,
                      sort_dicts=False,
                      width=160,
                  )
                  print()

                  if isinstance(
                      validity,
                      dict,
                  ):
                      validity_spec = validity.get(
                          "validityTimeSpecification",
                          {},
                      )
                  else:
                      validity_spec = {}

                  print(
                      "VALIDITY TIME SPECIFICATION:"
                  )
                  pprint(
                      validity_spec,
                      sort_dicts=False,
                      width=160,
                  )
                  print()

                  # ----------------------------------------------------
                  # LOCATION
                  # ----------------------------------------------------

                  location_reference = management.get(
                      "locationReference",
                      {},
                  )

                  print("LOCATION REFERENCE:")
                  pprint(
                      location_reference,
                      sort_dicts=False,
                      width=160,
                  )
                  print()

                  if isinstance(
                      location_reference,
                      dict,
                  ):

                      print(
                          "LOCATION REFERENCE KEYS:"
                      )
                      pprint(
                          list(
                              location_reference.keys()
                          )
                      )
                      print()

                      print(
                          "locLinearLocation:"
                      )
                      pprint(
                          location_reference.get(
                              "locLinearLocation"
                          ),
                          sort_dicts=False,
                          width=160,
                      )
                      print()

                      print(
                          "locLocationGroupByList:"
                      )
                      pprint(
                          location_reference.get(
                              "locLocationGroupByList"
                          ),
                          sort_dicts=False,
                          width=160,
                      )
                      print()

                  # ----------------------------------------------------
                  # OTHER POTENTIALLY IMPORTANT FIELDS
                  # ----------------------------------------------------

                  print(
                      "TOP-LEVEL RECORD IDENTIFIERS:"
                  )

                  for field in (
                      "situationRecordType",
                      "id",
                      "recordVersion",
                      "recordVersionTime",
                      "situationRecordCreationTime",
                      "situationRecordObservationTime",
                  ):
                      if field in record:
                          print(
                              f"{field}:"
                          )
                          pprint(
                              record[field],
                              sort_dicts=False,
                              width=160,
                          )

                  print()

          print("=" * 70)
          print("TEST 5 COMPLETE")
          print("=" * 70)
          print()
          print(
              "Raw API structure inspected directly."
          )
          print(
              "No data_processor.py processing performed."
          )
          print(
              "No production importer modification performed."
          )
          print(
              "No database writes performed."
          )
          print("=" * 70)

          PY
