name: Test National Highways Importer

on:
  workflow_dispatch:

jobs:
  test-national-highways-importer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run National Highways Test 5
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pprint import pprint

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"

          print("=" * 80)
          print("NATIONAL HIGHWAYS TEST 5")
          print("RAW API PAYLOAD INSPECTION")
          print("=" * 80)
          print()
          print("Purpose:")
          print("Determine the actual structure returned by the")
          print("National Highways closures endpoint when closureType")
          print("is NOT supplied.")
          print()
          print("Request:")
          print("  startDateTime:", START)
          print("  endDateTime:  ", END)
          print("  closureType:  NOT SUPPLIED")
          print()
          print("No production parser is being used.")
          print("No data_processor.py processing is being performed.")
          print("No database writes are being performed.")
          print()

          api_key = os.environ.get("NATIONAL_HIGHWAYS_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "NATIONAL_HIGHWAYS_API_KEY is not configured."
              )

          url = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          params = {
              "startDateTime": START,
              "endDateTime": END,
          }

          # These match the authentication / DATEX II headers
          # used by the existing National Highways parser.
          headers = {
              "Ocp-Apim-Subscription-Key": api_key,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          print("=" * 80)
          print("REQUEST")
          print("=" * 80)
          print("URL:", url)
          print()
          print("Parameters:")
          pprint(params)
          print()
          print("Headers:")
          print("  Ocp-Apim-Subscription-Key: [REDACTED]")
          print("  X-Response-MediaType: application/json")
          print("  X-Data-Format: DATEXII")
          print()

          print("Sending request...")
          print()

          response = requests.get(
              url,
              params=params,
              headers=headers,
              timeout=60,
          )

          print("HTTP STATUS:", response.status_code)
          print()

          if response.status_code != 200:
              print("=" * 80)
              print("API ERROR")
              print("=" * 80)
              print()
              print("Response headers:")
              pprint(dict(response.headers))
              print()
              print("Response body:")
              print(response.text[:10000])
              print()

              raise RuntimeError(
                  f"National Highways API returned "
                  f"HTTP {response.status_code}"
              )

          payload = response.json()

          print("=" * 80)
          print("RAW RESPONSE SUMMARY")
          print("=" * 80)
          print()

          print("Python payload type:")
          print(type(payload).__name__)
          print()

          if not isinstance(payload, dict):
              raise RuntimeError(
                  "Expected top-level JSON object."
              )

          print("Top-level keys:")
          pprint(list(payload.keys()))
          print()

          # ------------------------------------------------------------
          # D2Payload
          # ------------------------------------------------------------

          d2_payload = payload.get("D2Payload")

          print("=" * 80)
          print("D2Payload")
          print("=" * 80)
          print()

          print("D2Payload type:")
          print(type(d2_payload).__name__)
          print()

          if not isinstance(d2_payload, dict):
              print("D2Payload:")
              pprint(d2_payload)
              raise RuntimeError(
                  "D2Payload is not a dictionary."
              )

          print("D2Payload keys:")
          pprint(list(d2_payload.keys()))
          print()

          # ------------------------------------------------------------
          # situation[]
          # ------------------------------------------------------------

          situations = d2_payload.get(
              "situation",
              []
          )

          print("=" * 80)
          print("D2Payload.situation[]")
          print("=" * 80)
          print()

          print("Type:")
          print(type(situations).__name__)

          print("Count:")
          print(len(situations))
          print()

          if not isinstance(situations, list):
              raise RuntimeError(
                  "D2Payload.situation is not a list."
              )

          # Inspect enough records to understand the actual schema,
          # while avoiding an enormous Actions log.
          MAX_SITUATIONS = 5
          MAX_RECORDS_PER_SITUATION = 5

          for situation_index, situation in enumerate(
              situations[:MAX_SITUATIONS],
              start=1,
          ):

              print("=" * 80)
              print(
                  f"SITUATION {situation_index}"
              )
              print("=" * 80)
              print()

              print("Situation type:")
              print(type(situation).__name__)
              print()

              if not isinstance(situation, dict):
                  pprint(situation)
                  print()
                  continue

              print("Situation keys:")
              pprint(list(situation.keys()))
              print()

              records = situation.get(
                  "situationRecord",
                  []
              )

              print("situationRecord type:")
              print(type(records).__name__)

              print("situationRecord count:")
              print(len(records))
              print()

              if not isinstance(records, list):
                  pprint(records)
                  print()
                  continue

              for record_index, record in enumerate(
                  records[:MAX_RECORDS_PER_SITUATION],
                  start=1,
              ):

                  print("-" * 80)
                  print(
                      f"SITUATION {situation_index} "
                      f"/ situationRecord {record_index}"
                  )
                  print("-" * 80)
                  print()

                  if not isinstance(record, dict):
                      print("Record type:")
                      print(type(record).__name__)
                      print()
                      pprint(record)
                      print()
                      continue

                  # --------------------------------------------------
                  # Complete raw record
                  # --------------------------------------------------

                  print("RAW RECORD:")
                  print(
                      json.dumps(
                          record,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()

                  # --------------------------------------------------
                  # Record keys
                  # --------------------------------------------------

                  print("RECORD KEYS:")
                  pprint(list(record.keys()))
                  print()

                  # --------------------------------------------------
                  # Road / carriageway management
                  # --------------------------------------------------

                  management = record.get(
                      "sitRoadOrCarriagewayOrLaneManagement"
                  )

                  print(
                      "sitRoadOrCarriagewayOrLaneManagement:"
                  )
                  print(
                      json.dumps(
                          management,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()

                  if not isinstance(
                      management,
                      dict,
                  ):
                      continue

                  print("MANAGEMENT KEYS:")
                  pprint(list(management.keys()))
                  print()

                  # --------------------------------------------------
                  # VALIDITY
                  # --------------------------------------------------

                  validity = management.get(
                      "validity"
                  )

                  print("=" * 80)
                  print("VALIDITY")
                  print("=" * 80)
                  print()

                  print(
                      json.dumps(
                          validity,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()

                  if isinstance(validity, dict):

                      validity_spec = validity.get(
                          "validityTimeSpecification"
                      )

                      print(
                          "VALIDITY TIME SPECIFICATION:"
                      )
                      print(
                          json.dumps(
                              validity_spec,
                              indent=2,
                              ensure_ascii=False,
                          )
                      )
                      print()

                  # --------------------------------------------------
                  # LOCATION REFERENCE
                  # --------------------------------------------------

                  location_reference = management.get(
                      "locationReference"
                  )

                  print("=" * 80)
                  print("LOCATION REFERENCE")
                  print("=" * 80)
                  print()

                  print(
                      json.dumps(
                          location_reference,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  print()

                  if isinstance(
                      location_reference,
                      dict,
                  ):

                      print(
                          "LOCATION REFERENCE KEYS:"
                      )
                      pprint(
                          list(
                              location_reference.keys()
                          )
                      )
                      print()

                      print(
                          "locLinearLocation:"
                      )
                      print(
                          json.dumps(
                              location_reference.get(
                                  "locLinearLocation"
                              ),
                              indent=2,
                              ensure_ascii=False,
                          )
                      )
                      print()

                      print(
                          "locLocationGroupByList:"
                      )
                      print(
                          json.dumps(
                              location_reference.get(
                                  "locLocationGroupByList"
                              ),
                              indent=2,
                              ensure_ascii=False,
                          )
                      )
                      print()

                  # --------------------------------------------------
                  # Any useful top-level record fields
                  # --------------------------------------------------

                  print("=" * 80)
                  print("IMPORTANT RECORD FIELDS")
                  print("=" * 80)
                  print()

                  interesting_fields = [
                      "id",
                      "situationRecordType",
                      "recordVersion",
                      "recordVersionTime",
                      "situationRecordCreationTime",
                      "situationRecordObservationTime",
                      "situationRecordStatus",
                      "overallSeverity",
                      "probabilityOfOccurrence",
                      "roadMaintenance",
                      "roadworks",
                      "impact",
                      "publicEvent",
                  ]

                  for field in interesting_fields:
                      if field in record:
                          print(f"{field}:")
                          print(
                              json.dumps(
                                  record[field],
                                  indent=2,
                                  ensure_ascii=False,
                              )
                          )
                          print()

          # ------------------------------------------------------------
          # Summary
          # ------------------------------------------------------------

          print("=" * 80)
          print("TEST 5 COMPLETE")
          print("=" * 80)
          print()
          print(
              "The Actions log above is the authoritative Test 5 output."
          )
          print()
          print(
              "No closureType parameter was supplied."
          )
          print(
              "No normalised importer processing was performed."
          )
          print(
              "No data_processor.py processing was performed."
          )
          print(
              "No database writes were performed."
          )
          print("=" * 80)

          PY
