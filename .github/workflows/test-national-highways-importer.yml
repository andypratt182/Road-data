name: Test National Highways Importer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-national-highways-importer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run National Highways Test 5
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          from pprint import pformat
          from pathlib import Path
          import os
          import requests
          import sys

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"
          OUTPUT = Path("auditlog_test5.txt")

          lines = []

          def log(*args):
              text = " ".join(str(arg) for arg in args)
              print(text)
              lines.append(text)

          def dump(value):
              text = pformat(
                  value,
                  sort_dicts=False,
                  width=160,
              )
              print(text)
              lines.append(text)

          def save():
              OUTPUT.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

          try:
              log("=" * 70)
              log("NATIONAL HIGHWAYS TEST 5 - RAW PAYLOAD INSPECTION")
              log("=" * 70)
              log()
              log("One raw API request.")
              log("closureType: NOT supplied")
              log(f"Start: {START}")
              log(f"End:   {END}")
              log()
              log("This test deliberately bypasses the normalised importer")
              log("processing so that the actual D2Payload structure can")
              log("be inspected.")
              log()

              api_key = os.environ.get(
                  "NATIONAL_HIGHWAYS_API_KEY"
              )

              if not api_key:
                  raise RuntimeError(
                      "NATIONAL_HIGHWAYS_API_KEY is not configured."
                  )

              url = (
                  "https://api.data.nationalhighways.co.uk"
                  "/roads/v2.0/closures"
              )

              params = {
                  "startDateTime": START,
                  "endDateTime": END,
              }

              # These are the same authentication and DATEX II
              # headers used by the existing National Highways parser.
              headers = {
                  "Ocp-Apim-Subscription-Key": api_key,
                  "X-Response-MediaType": "application/json",
                  "X-Data-Format": "DATEXII",
              }

              log("REQUEST URL:")
              log(url)
              log()

              log("REQUEST PARAMETERS:")
              dump(params)
              log()

              log("REQUEST HEADERS:")
              log("Ocp-Apim-Subscription-Key: [REDACTED]")
              log("X-Response-MediaType: application/json")
              log("X-Data-Format: DATEXII")
              log()

              log("Sending request...")
              log()

              response = requests.get(
                  url,
                  params=params,
                  headers=headers,
                  timeout=60,
              )

              log("HTTP STATUS:")
              log(response.status_code)
              log()

              if response.status_code != 200:
                  log("=" * 70)
                  log("API REQUEST FAILED")
                  log("=" * 70)
                  log()
                  log("Response headers:")
                  dump(dict(response.headers))
                  log()
                  log("Response body:")
                  log(response.text[:10000])
                  log()

                  save()

                  raise RuntimeError(
                      f"National Highways API returned "
                      f"HTTP {response.status_code}"
                  )

              payload = response.json()

              log("=" * 70)
              log("RAW TOP-LEVEL STRUCTURE")
              log("=" * 70)
              log()

              if isinstance(payload, dict):
                  log("Top-level keys:")
                  dump(list(payload.keys()))
              else:
                  log("Unexpected payload type:")
                  log(type(payload).__name__)

              log()

              d2_payload = (
                  payload.get("D2Payload", {})
                  if isinstance(payload, dict)
                  else {}
              )

              log("D2Payload type:")
              log(type(d2_payload).__name__)
              log()

              if not isinstance(d2_payload, dict):
                  raise RuntimeError(
                      "D2Payload is not a dictionary."
                  )

              log("D2Payload keys:")
              dump(list(d2_payload.keys()))
              log()

              situations = d2_payload.get(
                  "situation",
                  []
              )

              log("Situation type:")
              log(type(situations).__name__)

              log("Situation count:")
              log(len(situations))
              log()

              if not isinstance(situations, list):
                  raise RuntimeError(
                      "D2Payload.situation is not a list."
                  )

              # Inspect the first three situations.
              for situation_number, situation in enumerate(
                  situations[:3],
                  start=1,
              ):

                  log("=" * 70)
                  log(
                      f"SITUATION {situation_number}"
                  )
                  log("=" * 70)
                  log()

                  if not isinstance(situation, dict):
                      log(
                          "Unexpected situation type:",
                          type(situation).__name__,
                      )
                      log()
                      continue

                  log("Situation keys:")
                  dump(list(situation.keys()))
                  log()

                  records = situation.get(
                      "situationRecord",
                      []
                  )

                  log("situationRecord type:")
                  log(type(records).__name__)

                  log("situationRecord count:")
                  log(len(records))
                  log()

                  if not isinstance(records, list):
                      log(
                          "Unexpected situationRecord type:",
                          type(records).__name__,
                      )
                      log()
                      continue

                  # Inspect the first three records from each situation.
                  for record_number, record in enumerate(
                      records[:3],
                      start=1,
                  ):

                      log("-" * 70)
                      log(
                          f"RAW situationRecord "
                          f"{record_number}"
                      )
                      log("-" * 70)
                      log()

                      if not isinstance(record, dict):
                          log(
                              "Unexpected record type:",
                              type(record).__name__,
                          )
                          log()
                          continue

                      log("Record keys:")
                      dump(list(record.keys()))
                      log()

                      log("FULL RAW RECORD:")
                      dump(record)
                      log()

                      management = record.get(
                          "sitRoadOrCarriagewayOrLaneManagement",
                          {},
                      )

                      log("MANAGEMENT TYPE:")
                      log(type(management).__name__)
                      log()

                      if not isinstance(management, dict):
                          log(
                              "Unexpected management structure."
                          )
                          log()
                          continue

                      log("MANAGEMENT KEYS:")
                      dump(list(management.keys()))
                      log()

                      # ------------------------------------------------
                      # VALIDITY
                      # ------------------------------------------------

                      validity = management.get(
                          "validity",
                          {},
                      )

                      log("VALIDITY:")
                      dump(validity)
                      log()

                      if isinstance(validity, dict):
                          validity_spec = validity.get(
                              "validityTimeSpecification",
                              {},
                          )
                      else:
                          validity_spec = {}

                      log(
                          "VALIDITY TIME SPECIFICATION:"
                      )
                      dump(validity_spec)
                      log()

                      # ------------------------------------------------
                      # LOCATION
                      # ------------------------------------------------

                      location_reference = management.get(
                          "locationReference",
                          {},
                      )

                      log("LOCATION REFERENCE:")
                      dump(location_reference)
                      log()

                      if isinstance(
                          location_reference,
                          dict,
                      ):

                          log(
                              "LOCATION REFERENCE KEYS:"
                          )
                          dump(
                              list(
                                  location_reference.keys()
                              )
                          )
                          log()

                          log(
                              "locLinearLocation:"
                          )
                          dump(
                              location_reference.get(
                                  "locLinearLocation"
                              )
                          )
                          log()

                          log(
                              "locLocationGroupByList:"
                          )
                          dump(
                              location_reference.get(
                                  "locLocationGroupByList"
                              )
                          )
                          log()

                      # ------------------------------------------------
                      # RECORD IDENTIFIERS
                      # ------------------------------------------------

                      log(
                          "TOP-LEVEL RECORD IDENTIFIERS:"
                      )

                      for field in (
                          "situationRecordType",
                          "id",
                          "recordVersion",
                          "recordVersionTime",
                          "situationRecordCreationTime",
                          "situationRecordObservationTime",
                      ):

                          if field in record:
                              log(f"{field}:")
                              dump(record[field])

                      log()

              log("=" * 70)
              log("TEST 5 COMPLETE")
              log("=" * 70)
              log()
              log(
                  "Raw API structure inspected directly."
              )
              log(
                  "No data_processor.py processing performed."
              )
              log(
                  "No production importer modification performed."
              )
              log(
                  "No database writes performed."
              )
              log("=" * 70)

              save()

              print()
              print(
                  f"Audit log written to {OUTPUT}"
              )

          except Exception as exc:
              log()
              log("=" * 70)
              log("TEST 5 FAILED")
              log("=" * 70)
              log()
              log(
                  "Exception:",
                  type(exc).__name__,
              )
              log(str(exc))
              log()

              save()

              print()
              print(
                  f"Failure details written to {OUTPUT}"
              )

              raise

          PY

      - name: Display Test 5 audit log
        if: always()
        run: |
          echo "========================================"
          echo "NATIONAL HIGHWAYS TEST 5 AUDIT LOG"
          echo "========================================"

          if [ -f auditlog_test5.txt ]; then
            cat auditlog_test5.txt
          else
            echo "auditlog_test5.txt was not created."
          fi

      - name: Commit Test 5 audit log to main
        if: always()
        run: |
          if [ ! -f auditlog_test5.txt ]; then
            echo "No audit log exists. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auditlog_test5.txt

          if git diff --cached --quiet; then
            echo "No changes to auditlog_test5.txt"
          else
            git commit -m "Update National Highways Test 5 audit log"
            git push origin HEAD:main
          fi
