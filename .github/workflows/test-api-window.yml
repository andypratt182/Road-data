name: Test API Full Pagination

on:
  workflow_dispatch:

jobs:
  test-api-full-pagination:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run controlled full-pagination audit
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # --------------------------------------------------
          # CONTROLLED TEST WINDOW
          # --------------------------------------------------

          start_string = "2026-08-11T00:00:00"
          end_string = "2026-08-18T23:59:59"

          initial_params = {
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          TARGET_ROADS = {
              "M6",
              "M57",
              "M58",
              "M62",
          }

          print("=" * 70)
          print("NATIONAL HIGHWAYS TEST 7")
          print("CONTROLLED FULL PAGINATION AUDIT")
          print("=" * 70)
          print()
          print("PURPOSE:")
          print(
              "Follow the official x-next pagination chain until "
              "the API returns no further x-next URL."
          )
          print()
          print("IMPORTANT:")
          print("closureType is intentionally NOT supplied.")
          print("pageCursor is NEVER manually constructed.")
          print(
              "Every subsequent request uses the exact x-next "
              "URL supplied by the previous response."
          )
          print()
          print("NO RETRIES.")
          print("NO MANUAL PAGE-CURSOR GENERATION.")
          print("NO REQUEST SPLITTING.")
          print("PRODUCTION WORKFLOW WILL NOT BE MODIFIED.")
          print()
          print("REQUEST WINDOW")
          print("-" * 70)
          print(f"Start: {start_string}")
          print(f"End:   {end_string}")
          print()
          print("Initial parameters:")
          print(
              json.dumps(
                  initial_params,
                  indent=2,
              )
          )
          print()

          # --------------------------------------------------
          # REQUEST COUNTER
          # --------------------------------------------------

          request_count = 0

          session = requests.Session()

          # --------------------------------------------------
          # GLOBAL AUDIT STATE
          # --------------------------------------------------

          total_records = 0
          total_situations = 0
          total_response_characters = 0

          page_sizes = []

          all_record_ids = set()
          duplicate_record_ids = set()

          records_without_ids = 0

          road_counts = Counter()

          page_summaries = []

          # --------------------------------------------------
          # DATEX II RECORD EXTRACTION
          # --------------------------------------------------

          def extract_records(payload):

              records = []

              if not isinstance(
                  payload,
                  dict,
              ):
                  return records

              d2payload = payload.get(
                  "D2Payload"
              )

              if not isinstance(
                  d2payload,
                  dict,
              ):
                  return records

              situations = d2payload.get(
                  "situation",
                  [],
              )

              if not isinstance(
                  situations,
                  list,
              ):
                  return records

              for situation in situations:

                  if not isinstance(
                      situation,
                      dict,
                  ):
                      continue

                  situation_records = situation.get(
                      "situationRecord",
                      [],
                  )

                  if not isinstance(
                      situation_records,
                      list,
                  ):
                      continue

                  records.extend(
                      situation_records
                  )

              return records

          # --------------------------------------------------
          # SITUATION COUNT
          # --------------------------------------------------

          def extract_situation_count(
              payload,
          ):

              if not isinstance(
                  payload,
                  dict,
              ):
                  return 0

              d2payload = payload.get(
                  "D2Payload"
              )

              if not isinstance(
                  d2payload,
                  dict,
              ):
                  return 0

              situations = d2payload.get(
                  "situation",
                  [],
              )

              if isinstance(
                  situations,
                  list,
              ):
                  return len(
                      situations
                  )

              return 0

          # --------------------------------------------------
          # CORRECT DATEX II RECORD ID
          # --------------------------------------------------

          def get_record_id(
              record,
          ):

              if not isinstance(
                  record,
                  dict,
              ):
                  return None

              # The actual ID observed in the
              # National Highways DATEX II payload
              # is nested inside the management object.

              management = record.get(
                  "sitRoadOrCarriagewayOrLaneManagement"
              )

              if isinstance(
                  management,
                  dict,
              ):

                  value = management.get(
                      "idG"
                  )

                  if value:
                      return str(
                          value
                      )

              # Additional fallbacks are retained
              # for diagnostic purposes only.

              for key in (
                  "idG",
                  "id",
                  "recordId",
                  "situationRecordId",
              ):

                  value = record.get(
                      key
                  )

                  if value:
                      return str(
                          value
                      )

              return None

          # --------------------------------------------------
          # ROAD EXTRACTION
          # --------------------------------------------------

          def extract_roads(
              record,
          ):

              found = set()

              if not isinstance(
                  record,
                  dict,
              ):
                  return found

              def walk(
                  obj,
              ):

                  if isinstance(
                      obj,
                      dict,
                  ):

                      for key, value in obj.items():

                          key_lower = str(
                              key
                          ).lower()

                          if key_lower in {
                              "roadname",
                              "roadnumber",
                          }:

                              if value:

                                  text = str(
                                      value
                                  ).strip().upper()

                                  text = text.replace(
                                      " ",
                                      "",
                                  )

                                  found.add(
                                      text
                                  )

                          walk(
                              value
                          )

                  elif isinstance(
                      obj,
                      list,
                  ):

                      for item in obj:

                          walk(
                              item
                          )

              walk(
                  record
              )

              return found

          # --------------------------------------------------
          # PROCESS PAGE
          # --------------------------------------------------

          def process_page(
              page_number,
              response,
              payload,
          ):

              global total_records
              global total_situations
              global total_response_characters
              global records_without_ids

              records = extract_records(
                  payload
              )

              situation_count = (
                  extract_situation_count(
                      payload
                  )
              )

              record_count = len(
                  records
              )

              response_characters = len(
                  response.text
              )

              total_records += (
                  record_count
              )

              total_situations += (
                  situation_count
              )

              total_response_characters += (
                  response_characters
              )

              page_sizes.append(
                  record_count
              )

              page_new_ids = 0
              page_duplicate_ids = 0

              page_target_counts = Counter()

              for record in records:

                  record_id = get_record_id(
                      record
                  )

                  if record_id:

                      if record_id in all_record_ids:

                          duplicate_record_ids.add(
                              record_id
                          )

                          page_duplicate_ids += 1

                      else:

                          all_record_ids.add(
                              record_id
                          )

                          page_new_ids += 1

                  else:

                      records_without_ids += 1

                  roads = extract_roads(
                      record
                  )

                  for road in roads:

                      if road in TARGET_ROADS:

                          road_counts[
                              road
                          ] += 1

                          page_target_counts[
                              road
                          ] += 1

              next_url = response.headers.get(
                  "x-next"
              )

              print("=" * 70)
              print(
                  f"PAGE {page_number}"
              )
              print("=" * 70)
              print()

              print(
                  f"HTTP status: "
                  f"{response.status_code}"
              )

              print(
                  f"Response characters: "
                  f"{response_characters}"
              )

              print(
                  f"Situations: "
                  f"{situation_count}"
              )

              print(
                  f"Situation records: "
                  f"{record_count}"
              )

              print(
                  f"Records with usable IDs: "
                  f"{page_new_ids}"
              )

              print(
                  f"Duplicate IDs on this page: "
                  f"{page_duplicate_ids}"
              )

              print()

              print(
                  "TARGET ROADS ON THIS PAGE"
              )
              print("-" * 70)

              if page_target_counts:

                  for road, count in sorted(
                      page_target_counts.items()
                  ):

                      print(
                          f"{road}: {count}"
                      )

              else:

                  print(
                      "No M6/M57/M58/M62 "
                      "road fields identified."
                  )

              print()

              print(
                  "x-next:"
              )

              if next_url:

                  print(
                      next_url
                  )

              else:

                  print(
                      "NOT PRESENT"
                  )

              print()

              page_summaries.append(
                  {
                      "page": page_number,
                      "records": record_count,
                      "situations": situation_count,
                      "characters": response_characters,
                      "new_ids": page_new_ids,
                      "duplicate_ids": page_duplicate_ids,
                      "target_roads": dict(
                          page_target_counts
                      ),
                      "has_next": bool(
                          next_url
                      ),
                  }
              )

              return next_url

          # ==================================================
          # PAGINATION LOOP
          # ==================================================

          next_url = None
          page_number = 1

          while True:

              # --------------------------------------------------
              # REQUEST URL
              # --------------------------------------------------

              if page_number == 1:

                  request_url = API_URL
                  request_kwargs = {
                      "params": initial_params,
                  }

              else:

                  # IMPORTANT:
                  # Use the exact URL returned by x-next.
                  # Do not reconstruct the cursor.

                  request_url = next_url
                  request_kwargs = {}

              print("=" * 70)
              print(
                  f"REQUEST {request_count + 1}"
              )
              print("=" * 70)
              print()

              print(
                  "Request URL:"
              )
              print(
                  request_url
              )

              print()

              request_count += 1

              response = session.get(
                  request_url,
                  headers=headers,
                  timeout=60,
                  **request_kwargs,
              )

              print(
                  f"Request count: "
                  f"{request_count}"
              )

              print()

              # --------------------------------------------------
              # RATE LIMIT
              # --------------------------------------------------

              if response.status_code == 429:

                  print("=" * 70)
                  print("RATE LIMIT RECEIVED")
                  print("=" * 70)
                  print()

                  print(
                      "Retry-After:"
                  )

                  print(
                      response.headers.get(
                          "Retry-After",
                          "not supplied",
                      )
                  )

                  print()

                  print(
                      "NO RETRY WILL BE PERFORMED."
                  )

                  print(
                      "Pagination audit stopped."
                  )

                  raise SystemExit(1)

              # --------------------------------------------------
              # HTTP ERROR
              # --------------------------------------------------

              if response.status_code != 200:

                  print("=" * 70)
                  print("HTTP ERROR")
                  print("=" * 70)
                  print()

                  print(
                      f"Status: "
                      f"{response.status_code}"
                  )

                  print()

                  print(
                      "Response:"
                  )

                  print(
                      response.text[:5000]
                  )

                  print()

                  print(
                      "NO RETRY WILL BE PERFORMED."
                  )

                  print(
                      "Pagination audit stopped."
                  )

                  raise SystemExit(1)

              # --------------------------------------------------
              # JSON PARSE
              # --------------------------------------------------

              try:

                  payload = response.json()

              except Exception as exc:

                  print("=" * 70)
                  print("JSON PARSE ERROR")
                  print("=" * 70)
                  print()

                  print(
                      exc
                  )

                  print()

                  print(
                      "NO RETRY WILL BE PERFORMED."
                  )

                  raise SystemExit(1)

              # --------------------------------------------------
              # PROCESS PAGE
              # --------------------------------------------------

              next_url = process_page(
                  page_number,
                  response,
                  payload,
              )

              # --------------------------------------------------
              # STOP WHEN NO x-next
              # --------------------------------------------------

              if not next_url:

                  break

              page_number += 1

          # ==================================================
          # FINAL AUDIT
          # ==================================================

          print("=" * 70)
          print("FULL PAGINATION AUDIT RESULT")
          print("=" * 70)
          print()

          print(
              f"Pages retrieved: "
              f"{len(page_summaries)}"
          )

          print(
              f"API requests made: "
              f"{request_count}"
          )

          print(
              f"Total situations: "
              f"{total_situations}"
          )

          print(
              f"Total situation records: "
              f"{total_records}"
          )

          print(
              f"Total response characters: "
              f"{total_response_characters}"
          )

          print()

          # --------------------------------------------------
          # PAGE SIZE SUMMARY
          # --------------------------------------------------

          print(
              "PAGE SIZES"
          )
          print("-" * 70)

          for index, size in enumerate(
              page_sizes,
              start=1,
          ):

              print(
                  f"Page {index}: "
                  f"{size}"
              )

          print()

          if page_sizes:

              full_500_pages = sum(
                  1
                  for size in page_sizes
                  if size == 500
              )

              final_page_size = page_sizes[-1]

              print(
                  f"Pages containing exactly "
                  f"500 records: "
                  f"{full_500_pages}"
              )

              print(
                  f"Final page size: "
                  f"{final_page_size}"
              )

          print()

          # --------------------------------------------------
          # ID AUDIT
          # --------------------------------------------------

          print(
              "RECORD ID AUDIT"
          )
          print("-" * 70)

          print(
              f"Unique record IDs: "
              f"{len(all_record_ids)}"
          )

          print(
              f"Records without usable IDs: "
              f"{records_without_ids}"
          )

          print(
              f"Duplicate IDs across pages: "
              f"{len(duplicate_record_ids)}"
          )

          if duplicate_record_ids:

              print()

              print(
                  "First duplicate IDs:"
              )

              for record_id in sorted(
                  duplicate_record_ids
              )[:25]:

                  print(
                      f"- {record_id}"
                  )

          print()

          # --------------------------------------------------
          # TARGET ROAD SUMMARY
          # --------------------------------------------------

          print(
              "TARGET ROAD SUMMARY"
          )
          print("-" * 70)

          for road in sorted(
              TARGET_ROADS
          ):

              print(
                  f"{road}: "
                  f"{road_counts.get(road, 0)}"
              )

          print()

          # --------------------------------------------------
          # PAGE SUMMARY TABLE
          # --------------------------------------------------

          print(
              "PAGE SUMMARY"
          )
          print("-" * 70)

          for summary in page_summaries:

              roads = summary[
                  "target_roads"
              ]

              road_text = ", ".join(
                  f"{road}={count}"
                  for road, count
                  in sorted(
                      roads.items()
                  )
              )

              if not road_text:

                  road_text = "none"

              print(
                  f"Page {summary['page']}: "
                  f"{summary['records']} records, "
                  f"{summary['new_ids']} new IDs, "
                  f"{summary['duplicate_ids']} duplicates, "
                  f"targets={road_text}, "
                  f"x-next="
                  f"{summary['has_next']}"
              )

          print()

          # ==================================================
          # FINAL CONCLUSION
          # ==================================================

          print("=" * 70)
          print("TEST 7 CONCLUSION")
          print("=" * 70)
          print()

          if (
              len(page_summaries) > 1
              and not duplicate_record_ids
          ):

              print(
                  "RESULT: FULL PAGINATION "
                  "CHAIN SUCCESSFULLY TRAVERSED."
              )

              print()

              print(
                  "The API returned multiple pages "
                  "and each subsequent page was obtained "
                  "from the x-next URL supplied by the "
                  "previous page."
              )

              print()

              print(
                  "No duplicate record IDs were detected "
                  "across the retrieved pages."
              )

          elif len(page_summaries) == 1:

              print(
                  "RESULT: ONLY ONE PAGE WAS RETURNED."
              )

              print(
                  "No x-next continuation was supplied."
              )

          else:

              print(
                  "RESULT: PAGINATION COMPLETED "
                  "BUT DUPLICATE RECORD IDs WERE "
                  "DETECTED."
              )

              print(
                  "Further investigation is required "
                  "before production pagination is enabled."
              )

          print()

          print(
              "PAGINATION RULE CONFIRMED:"
          )

          print(
              "1. First request uses the normal "
              "/closures endpoint."
          )

          print(
              "2. Read x-next from the response headers."
          )

          print(
              "3. Follow the exact x-next URL."
          )

          print(
              "4. Repeat until x-next is absent."
          )

          print(
              "5. Never manually construct pageCursor."
          )

          print()

          print(
              f"TOTAL API REQUESTS: "
              f"{request_count}"
          )

          print(
              "NO RETRIES."
          )

          print(
              "NO MANUAL PAGE-CURSOR GENERATION."
          )

          print(
              "NO REQUEST SPLITTING."
          )

          print(
              "PRODUCTION WORKFLOW WAS NOT MODIFIED."
          )

          print()
          print(
              "TEST 7 COMPLETE."
          )
          PY
