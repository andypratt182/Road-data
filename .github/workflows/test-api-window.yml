name: Diagnose National Highways API Date Filters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test API date parameters
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timedelta, timezone

          import requests

          API_BASE_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          now = datetime.now(
              timezone.utc
          ).replace(microsecond=0)

          seven_days = now + timedelta(days=7)

          def iso(dt):
              return dt.isoformat().replace(
                  "+00:00",
                  "Z",
              )

          start = iso(now)
          end = iso(seven_days)

          tests = [
              (
                  "1 - Planned only",
                  {
                      "closureType": "planned",
                  },
              ),
              (
                  "2 - Unplanned only",
                  {
                      "closureType": "unplanned",
                  },
              ),
              (
                  "3 - Planned + startDateTime",
                  {
                      "closureType": "planned",
                      "startDateTime": start,
                  },
              ),
              (
                  "4 - Planned + endDateTime",
                  {
                      "closureType": "planned",
                      "endDateTime": end,
                  },
              ),
              (
                  "5 - Planned + start + end",
                  {
                      "closureType": "planned",
                      "startDateTime": start,
                      "endDateTime": end,
                  },
              ),
              (
                  "6 - Unplanned + start + end",
                  {
                      "closureType": "unplanned",
                      "startDateTime": start,
                      "endDateTime": end,
                  },
              ),
          ]

          print("=" * 80)
          print("NATIONAL HIGHWAYS API DATE FILTER DIAGNOSTIC")
          print("=" * 80)

          print()
          print(f"Test start: {start}")
          print(f"Seven days: {end}")
          print()

          results = []

          for name, params in tests:

              print("=" * 80)
              print(name)
              print("=" * 80)

              print()
              print("Parameters:")
              print(
                  json.dumps(
                      params,
                      indent=2,
                  )
              )

              try:

                  response = requests.get(
                      f"{API_BASE_URL}/closures",
                      params=params,
                      headers=headers,
                      timeout=60,
                  )

                  print()
                  print(
                      f"HTTP status: "
                      f"{response.status_code}"
                  )

                  print()
                  print(
                      f"Final URL:"
                  )

                  print(
                      response.url
                  )

                  print()
                  print(
                      "Response headers:"
                  )

                  for key, value in response.headers.items():

                      if key.lower() in {
                          "content-type",
                          "retry-after",
                          "x-ratelimit-limit",
                          "x-ratelimit-remaining",
                          "x-ratelimit-reset",
                      }:

                          print(
                              f"  {key}: {value}"
                          )

                  print()
                  print(
                      "Response body:"
                  )

                  body = response.text

                  if len(body) > 5000:
                      body = (
                          body[:5000]
                          + "\n...[truncated]"
                      )

                  print(body)

                  record_count = None

                  if response.ok:

                      try:

                          payload = (
                              response.json()
                          )

                          if isinstance(
                              payload,
                              list,
                          ):
                              record_count = (
                                  len(payload)
                              )

                          elif isinstance(
                              payload,
                              dict,
                          ):

                              for key in (
                                  "closures",
                                  "results",
                                  "items",
                                  "value",
                                  "data",
                              ):

                                  value = (
                                      payload.get(
                                          key
                                      )
                                  )

                                  if isinstance(
                                      value,
                                      list,
                                  ):

                                      record_count = (
                                          len(value)
                                      )

                                      break

                          if record_count is not None:

                              print()
                              print(
                                  "Records returned: "
                                  f"{record_count}"
                              )

                      except Exception as exc:

                          print()
                          print(
                              "Could not determine "
                              "record count:"
                          )

                          print(exc)

                  results.append(
                      {
                          "name": name,
                          "status": response.status_code,
                          "url": response.url,
                          "record_count": record_count,
                      }
                  )

              except Exception as exc:

                  print()
                  print(
                      "REQUEST ERROR:"
                  )

                  print(
                      repr(exc)
                  )

                  results.append(
                      {
                          "name": name,
                          "status": "request-error",
                          "error": repr(exc),
                      }
                  )

          print()
          print()
          print("=" * 80)
          print("SUMMARY")
          print("=" * 80)

          for result in results:

              print()

              print(
                  f"{result['name']}"
              )

              print(
                  f"  HTTP status: "
                  f"{result['status']}"
              )

              if result.get(
                  "record_count"
              ) is not None:

                  print(
                      f"  Records: "
                      f"{result['record_count']}"
                  )

          print()
          print("=" * 80)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 80)

          print()
          print(
              "This workflow is diagnostic only."
          )

          print(
              "The production road-data workflow "
              "has not been modified."
          )
          PY
