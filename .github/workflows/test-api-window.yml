name: Test API Date Window

on:
  workflow_dispatch:

jobs:
  test-api-window:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run controlled single-request date filter diagnostic
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # ==================================================
          # CONTROLLED TEST WINDOW
          #
          # EXACTLY ONE REQUEST
          # NO RETRIES
          # NO SPLITTING
          # ==================================================

          start_string = "2026-08-11T00:00:00"
          end_string = "2026-08-18T23:59:59"

          params = {
              "closureType": "planned",
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          requested_start = datetime.fromisoformat(
              start_string
          ).replace(tzinfo=timezone.utc)

          requested_end = datetime.fromisoformat(
              end_string
          ).replace(tzinfo=timezone.utc)

          print("=" * 70)
          print("NATIONAL HIGHWAYS DATE FILTER DIAGNOSTIC")
          print("=" * 70)
          print()
          print("CONTROLLED POPULATED-PERIOD TEST")
          print()
          print("THIS TEST MAKES EXACTLY ONE API REQUEST.")
          print("NO RETRIES.")
          print("NO SPLITTING.")
          print()
          print("REQUEST WINDOW")
          print("-" * 70)
          print(f"Start: {start_string}")
          print(f"End:   {end_string}")
          print()
          print("Parameters:")
          print(json.dumps(params, indent=2))
          print()
          print("Requesting API...")
          print()

          # ==================================================
          # EXACTLY ONE HTTP REQUEST
          # ==================================================

          response = requests.get(
              API_URL,
              params=params,
              headers=headers,
              timeout=60,
          )

          print(f"HTTP status: {response.status_code}")
          print()
          print("Final URL:")
          print(response.url)
          print()

          # ==================================================
          # RATE LIMIT
          # ==================================================

          if response.status_code == 429:

              print("RATE LIMIT REACHED")
              print()

              print("Retry-After:")
              print(
                  response.headers.get(
                      "Retry-After",
                      "not supplied",
                  )
              )

              print()
              print(
                  "No retry was attempted. "
                  "This diagnostic intentionally makes "
                  "one request only."
              )

              raise SystemExit(1)

          # ==================================================
          # OTHER HTTP ERRORS
          # ==================================================

          if response.status_code != 200:

              print("REQUEST FAILED")
              print()
              print("Response body:")
              print(response.text[:5000])

              raise SystemExit(1)

          # ==================================================
          # PARSE RESPONSE
          # ==================================================

          try:
              payload = response.json()

          except Exception as exc:

              print("Unable to decode JSON response:")
              print(exc)
              print()
              print(response.text[:5000])

              raise SystemExit(1)

          # ==================================================
          # FIND RECORD LIST
          # ==================================================

          records = []

          if isinstance(payload, list):

              records = payload

          elif isinstance(payload, dict):

              for key in (
                  "closures",
                  "data",
                  "results",
                  "items",
                  "features",
              ):

                  value = payload.get(key)

                  if isinstance(value, list):

                      records = value
                      break

          print("=" * 70)
          print("RESPONSE")
          print("=" * 70)
          print()
          print(f"Records returned: {len(records)}")
          print()

          # ==================================================
          # DATETIME PARSING
          # ==================================================

          def parse_datetime(value):

              if not value:
                  return None

              if isinstance(value, datetime):
                  dt = value

              else:

                  text = str(value).strip()

                  if not text:
                      return None

                  # Normalise UTC Z suffix.
                  if text.endswith("Z"):
                      text = text[:-1] + "+00:00"

                  try:
                      dt = datetime.fromisoformat(text)

                  except ValueError:
                      return None

              if dt.tzinfo is None:

                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              else:

                  dt = dt.astimezone(
                      timezone.utc
                  )

              return dt

          # ==================================================
          # FIELD EXTRACTION
          # ==================================================

          def get_field(record, *names):

              if not isinstance(record, dict):
                  return None

              for name in names:

                  if name in record:
                      return record[name]

              return None


          def extract_start(record):

              return get_field(
                  record,
                  "start",
                  "startDateTime",
                  "start_datetime",
                  "startDate",
                  "from",
              )


          def extract_end(record):

              return get_field(
                  record,
                  "end",
                  "endDateTime",
                  "end_datetime",
                  "endDate",
                  "to",
              )


          def extract_road(record):

              return get_field(
                  record,
                  "road",
                  "roadName",
                  "roadNumber",
              )


          def extract_direction(record):

              return get_field(
                  record,
                  "direction",
                  "directionDescription",
              )


          def extract_description(record):

              return get_field(
                  record,
                  "description",
                  "comment",
                  "remarks",
              )

          # ==================================================
          # TIMESTAMP ANALYSIS
          # ==================================================

          start_values = []
          end_values = []

          starts_before = 0
          starts_inside = 0
          starts_after = 0
          unknown_start = 0

          ends_before = 0
          ends_inside = 0
          ends_after = 0
          unknown_end = 0

          before_start_records = []
          after_start_records = []

          for record in records:

              raw_start = extract_start(record)
              raw_end = extract_end(record)

              parsed_start = parse_datetime(
                  raw_start
              )

              parsed_end = parse_datetime(
                  raw_end
              )

              # ----------------------------------------------
              # START
              # ----------------------------------------------

              if parsed_start:

                  start_values.append(
                      parsed_start
                  )

                  if parsed_start < requested_start:

                      starts_before += 1

                      if len(
                          before_start_records
                      ) < 10:

                          before_start_records.append(
                              (
                                  record,
                                  raw_start,
                                  raw_end,
                              )
                          )

                  elif parsed_start <= requested_end:

                      starts_inside += 1

                  else:

                      starts_after += 1

                      if len(
                          after_start_records
                      ) < 10:

                          after_start_records.append(
                              (
                                  record,
                                  raw_start,
                                  raw_end,
                              )
                          )

              else:

                  unknown_start += 1

              # ----------------------------------------------
              # END
              # ----------------------------------------------

              if parsed_end:

                  end_values.append(
                      parsed_end
                  )

                  if parsed_end < requested_start:

                      ends_before += 1

                  elif parsed_end <= requested_end:

                      ends_inside += 1

                  else:

                      ends_after += 1

              else:

                  unknown_end += 1

          # ==================================================
          # START TIMESTAMP ANALYSIS
          # ==================================================

          print("START TIMESTAMP ANALYSIS")
          print("-" * 70)

          if start_values:

              earliest_start = min(
                  start_values
              )

              latest_start = max(
                  start_values
              )

              print("Earliest closure start:")
              print(
                  earliest_start.isoformat()
              )

              print()

              print("Latest closure start:")
              print(
                  latest_start.isoformat()
              )

          else:

              print(
                  "No usable start timestamps "
                  "were found."
              )

          print()

          print(
              "Records starting BEFORE "
              "requested window:"
          )
          print(starts_before)

          print()

          print(
              "Records starting INSIDE "
              "requested window:"
          )
          print(starts_inside)

          print()

          print(
              "Records starting AFTER "
              "requested window:"
          )
          print(starts_after)

          print()

          print(
              "Records with unknown start:"
          )
          print(unknown_start)

          # ==================================================
          # END TIMESTAMP ANALYSIS
          # ==================================================

          print()
          print("END TIMESTAMP ANALYSIS")
          print("-" * 70)

          if end_values:

              earliest_end = min(
                  end_values
              )

              latest_end = max(
                  end_values
              )

              print("Earliest closure end:")
              print(
                  earliest_end.isoformat()
              )

              print()

              print("Latest closure end:")
              print(
                  latest_end.isoformat()
              )

          else:

              print(
                  "No usable end timestamps "
                  "were found."
              )

          print()

          print(
              "Records ending BEFORE "
              "requested window:"
          )
          print(ends_before)

          print()

          print(
              "Records ending INSIDE "
              "requested window:"
          )
          print(ends_inside)

          print()

          print(
              "Records ending AFTER "
              "requested window:"
          )
          print(ends_after)

          print()

          print(
              "Records with unknown end:"
          )
          print(unknown_end)

          # ==================================================
          # ROAD ANALYSIS
          # ==================================================

          roads = {}

          for record in records:

              road = extract_road(
                  record
              )

              if road:

                  road_name = str(
                      road
                  )

                  roads[road_name] = (
                      roads.get(
                          road_name,
                          0,
                      )
                      + 1
                  )

          print()
          print("ROADS REPRESENTED")
          print("-" * 70)

          if not roads:

              print(
                  "No road fields were identified."
              )

          else:

              for road, count in sorted(
                  roads.items(),
                  key=lambda item: (
                      -item[1],
                      item[0],
                  ),
              ):

                  print(
                      f"{road}: {count}"
                  )

          # ==================================================
          # SAMPLE RECORDS STARTING BEFORE WINDOW
          # ==================================================

          print()
          print(
              "SAMPLE RECORDS STARTING "
              "BEFORE REQUESTED WINDOW"
          )
          print("-" * 70)

          if not before_start_records:

              print(
                  "No records starting before "
                  "the requested window were returned."
              )

          else:

              for number, (
                  record,
                  raw_start,
                  raw_end,
              ) in enumerate(
                  before_start_records,
                  start=1,
              ):

                  print()
                  print(
                      f"Record {number}"
                  )

                  print(
                      f"Road: "
                      f"{extract_road(record)}"
                  )

                  print(
                      f"Direction: "
                      f"{extract_direction(record)}"
                  )

                  print(
                      f"Start: "
                      f"{raw_start}"
                  )

                  print(
                      f"End: "
                      f"{raw_end}"
                  )

                  print(
                      f"Description: "
                      f"{extract_description(record)}"
                  )

          # ==================================================
          # SAMPLE RECORDS STARTING AFTER WINDOW
          # ==================================================

          print()
          print(
              "SAMPLE RECORDS STARTING "
              "AFTER REQUESTED WINDOW"
          )
          print("-" * 70)

          if not after_start_records:

              print(
                  "No records starting after "
                  "the requested window were returned."
              )

          else:

              for number, (
                  record,
                  raw_start,
                  raw_end,
              ) in enumerate(
                  after_start_records,
                  start=1,
              ):

                  print()
                  print(
                      f"Record {number}"
                  )

                  print(
                      f"Road: "
                      f"{extract_road(record)}"
                  )

                  print(
                      f"Direction: "
                      f"{extract_direction(record)}"
                  )

                  print(
                      f"Start: "
                      f"{raw_start}"
                  )

                  print(
                      f"End: "
                      f"{raw_end}"
                  )

                  print(
                      f"Description: "
                      f"{extract_description(record)}"
                  )

          # ==================================================
          # CONTROLLED TEST CONCLUSION
          # ==================================================

          print()
          print("=" * 70)
          print("DIAGNOSTIC RESULT")
          print("=" * 70)
          print()

          total_with_start = (
              starts_before
              + starts_inside
              + starts_after
          )

          if len(records) == 0:

              print(
                  "RESULT: INCONCLUSIVE"
              )
              print()
              print(
                  "The API returned zero records."
              )
              print(
                  "There are no closure timestamps "
                  "available to compare with the "
                  "requested window."
              )
              print()
              print(
                  "The behaviour of startDateTime "
                  "cannot be determined from this request."
              )

          elif total_with_start == 0:

              print(
                  "RESULT: INCONCLUSIVE"
              )
              print()
              print(
                  "Records were returned, but none "
                  "contained a usable start timestamp."
              )

          else:

              print(
                  f"Records with usable start timestamps: "
                  f"{total_with_start}"
              )

              print()

              print(
                  f"Starting before window: "
                  f"{starts_before}"
              )

              print(
                  f"Starting inside window: "
                  f"{starts_inside}"
              )

              print(
                  f"Starting after window: "
                  f"{starts_after}"
              )

              print()

              # ----------------------------------------------
              # PRIMARY TEST
              # ----------------------------------------------

              if starts_before > 0:

                  print(
                      "RESULT: STARTDATETIME IS NOT "
                      "A STRICT LOWER-BOUND FILTER."
                  )

                  print()

                  print(
                      "The API returned one or more "
                      "records whose actual closure "
                      "start time is BEFORE the supplied "
                      "startDateTime."
                  )

                  print()

                  print(
                      "This means the production importer "
                      "must not assume that every returned "
                      "record starts inside the requested "
                      "window."
                  )

              elif starts_after > 0:

                  print(
                      "RESULT: PARTIAL/UNCERTAIN FILTERING."
                  )

                  print()

                  print(
                      "No records started before the "
                      "requested window, but records "
                      "starting after the requested end "
                      "were returned."
                  )

                  print()

                  print(
                      "This indicates that the API response "
                      "cannot simply be assumed to contain "
                      "only records whose start time falls "
                      "inside the requested window."
                  )

              else:

                  print(
                      "RESULT: STRONG EVIDENCE OF "
                      "STARTDATETIME FILTERING."
                  )

                  print()

                  print(
                      "Every returned record with a usable "
                      "start timestamp begins inside the "
                      "requested window."
                  )

          # ==================================================
          # FINAL SAFETY STATEMENT
          # ==================================================

          print()
          print("=" * 70)
          print("TEST COMPLETE")
          print("=" * 70)
          print()
          print(
              "Exactly one API request was made."
          )
          print(
              "No retries were performed."
          )
          print(
              "No request splitting was performed."
          )
          print(
              "Production workflow was not modified."
          )
          PY
