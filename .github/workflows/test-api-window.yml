name: Test API Date Window

on:
  workflow_dispatch:

jobs:
  test-api-window:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Test 3 - single request with raw response inspection
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # ==================================================
          # TEST 3
          #
          # PURPOSE:
          # Determine whether closureType=planned was
          # responsible for the previous zero-record result.
          #
          # EXACTLY ONE REQUEST
          # NO RETRIES
          # NO SPLITTING
          #
          # IMPORTANT:
          # closureType is intentionally NOT supplied.
          # ==================================================

          start_string = "2026-08-11T00:00:00"
          end_string = "2026-08-18T23:59:59"

          params = {
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          requested_start = datetime.fromisoformat(
              start_string
          ).replace(tzinfo=timezone.utc)

          requested_end = datetime.fromisoformat(
              end_string
          ).replace(tzinfo=timezone.utc)

          print("=" * 70)
          print("NATIONAL HIGHWAYS API TEST 3")
          print("=" * 70)
          print()
          print("CONTROLLED SINGLE-REQUEST TEST")
          print()
          print("PURPOSE:")
          print(
              "Determine whether closureType=planned "
              "was responsible for the previous "
              "zero-record result."
          )
          print()
          print("THIS TEST MAKES EXACTLY ONE API REQUEST.")
          print("NO RETRIES.")
          print("NO SPLITTING.")
          print()
          print("IMPORTANT:")
          print("closureType is intentionally NOT supplied.")
          print()
          print("REQUEST WINDOW")
          print("-" * 70)
          print(f"Start: {start_string}")
          print(f"End:   {end_string}")
          print()
          print("Parameters:")
          print(json.dumps(params, indent=2))
          print()
          print("Requesting API...")
          print()

          # ==================================================
          # EXACTLY ONE HTTP REQUEST
          # ==================================================

          response = requests.get(
              API_URL,
              params=params,
              headers=headers,
              timeout=60,
          )

          print(f"HTTP status: {response.status_code}")
          print()
          print("Final URL:")
          print(response.url)
          print()

          # ==================================================
          # RESPONSE HEADERS
          # ==================================================

          print("RESPONSE HEADERS")
          print("-" * 70)

          interesting_headers = (
              "content-type",
              "content-length",
              "x-request-id",
              "request-id",
              "retry-after",
          )

          for key, value in response.headers.items():

              if key.lower() in interesting_headers:

                  print(
                      f"{key}: {value}"
                  )

          print()

          # ==================================================
          # RATE LIMIT
          # ==================================================

          if response.status_code == 429:

              print("RATE LIMIT REACHED")
              print()
              print(
                  "Retry-After:"
              )
              print(
                  response.headers.get(
                      "Retry-After",
                      "not supplied",
                  )
              )
              print()
              print(
                  "No retry was attempted."
              )
              print(
                  "This diagnostic intentionally "
                  "makes one request only."
              )

              raise SystemExit(1)

          # ==================================================
          # HTTP ERROR
          # ==================================================

          if response.status_code != 200:

              print("REQUEST FAILED")
              print()
              print("Response body:")
              print(
                  response.text[:10000]
              )

              raise SystemExit(1)

          # ==================================================
          # RAW RESPONSE INSPECTION
          #
          # This happens locally after the ONE request.
          # It does NOT make another API request.
          # ==================================================

          raw_text = response.text

          print("=" * 70)
          print("RAW RESPONSE INSPECTION")
          print("=" * 70)
          print()
          print(
              f"Response character count: "
              f"{len(raw_text)}"
          )
          print()

          if not raw_text.strip():

              print(
                  "Response body is completely empty."
              )

              print()
              print(
                  "This is important: HTTP 200 was "
                  "returned, but the response body "
                  "contains no data."
              )

              raise SystemExit(0)

          print(
              "First 5000 characters of response:"
          )
          print("-" * 70)
          print(
              raw_text[:5000]
          )
          print("-" * 70)
          print()

          # ==================================================
          # JSON PARSING
          # ==================================================

          try:

              payload = response.json()

          except Exception as exc:

              print(
                  "Response is NOT valid JSON."
              )
              print()
              print(
                  f"JSON parsing error: {exc}"
              )
              print()
              print(
                  "The raw response above is the "
                  "authoritative diagnostic output."
              )

              raise SystemExit(0)

          print(
              "Response IS valid JSON."
          )
          print()

          # ==================================================
          # JSON STRUCTURE INSPECTION
          # ==================================================

          print("JSON STRUCTURE")
          print("-" * 70)

          print(
              f"Top-level Python type: "
              f"{type(payload).__name__}"
          )

          if isinstance(payload, dict):

              print(
                  "Top-level keys:"
              )

              for key in payload.keys():

                  print(
                      f"  - {key}"
                  )

          elif isinstance(payload, list):

              print(
                  f"Top-level list length: "
                  f"{len(payload)}"
              )

          else:

              print(
                  "Top-level JSON value:"
              )

              print(
                  repr(payload)
              )

          print()

          # ==================================================
          # SAFE RECORD DISCOVERY
          # ==================================================

          records = []

          if isinstance(payload, list):

              records = payload

              print(
                  "Records interpreted from "
                  "top-level JSON list."
              )

          elif isinstance(payload, dict):

              candidate_keys = (
                  "closures",
                  "data",
                  "results",
                  "items",
                  "features",
                  "events",
                  "roadClosures",
                  "closure",
              )

              print(
                  "Checking common record containers:"
              )

              for key in candidate_keys:

                  if key not in payload:
                      continue

                  value = payload[key]

                  print(
                      f"  {key}: "
                      f"{type(value).__name__}"
                  )

                  if isinstance(value, list):

                      print(
                          f"    list length: "
                          f"{len(value)}"
                      )

                      if not records:

                          records = value

          print()

          print(
              f"Records identified: "
              f"{len(records)}"
          )

          # ==================================================
          # SAMPLE RECORD STRUCTURE
          # ==================================================

          if records:

              print()
              print(
                  "FIRST RECORD STRUCTURE"
              )
              print("-" * 70)

              first_record = records[0]

              print(
                  json.dumps(
                      first_record,
                      indent=2,
                      default=str,
                  )[:15000]
              )

              print()

              if isinstance(
                  first_record,
                  dict,
              ):

                  print(
                      "First-record keys:"
                  )

                  for key in first_record.keys():

                      print(
                          f"  - {key}"
                      )

          # ==================================================
          # GENERIC DATETIME DISCOVERY
          #
          # Instead of assuming field names, inspect the
          # actual returned record recursively.
          # ==================================================

          def find_datetime_values(
              value,
              path="root",
              results=None,
          ):

              if results is None:
                  results = []

              if isinstance(value, dict):

                  for key, child in value.items():

                      child_path = (
                          f"{path}.{key}"
                      )

                      find_datetime_values(
                          child,
                          child_path,
                          results,
                      )

              elif isinstance(value, list):

                  for index, child in enumerate(
                      value
                  ):

                      child_path = (
                          f"{path}[{index}]"
                      )

                      find_datetime_values(
                          child,
                          child_path,
                          results,
                      )

              elif isinstance(value, str):

                  text = value.strip()

                  if not text:
                      return results

                  candidate = text

                  if candidate.endswith("Z"):

                      candidate = (
                          candidate[:-1]
                          + "+00:00"
                      )

                  try:

                      dt = datetime.fromisoformat(
                          candidate
                      )

                      if dt.tzinfo is None:

                          dt = dt.replace(
                              tzinfo=timezone.utc
                          )

                      else:

                          dt = dt.astimezone(
                              timezone.utc
                          )

                      results.append(
                          (
                              path,
                              text,
                              dt,
                          )
                      )

                  except ValueError:
                      pass

              return results

          # ==================================================
          # DATETIME ANALYSIS
          # ==================================================

          print()
          print(
              "DATETIME FIELD DISCOVERY"
          )
          print("-" * 70)

          all_datetime_values = []

          # Limit inspection to first 10 records so that
          # diagnostic output remains manageable.

          for index, record in enumerate(
              records[:10]
          ):

              values = find_datetime_values(
                  record,
                  path=f"record[{index}]",
              )

              all_datetime_values.extend(
                  values
              )

          if not all_datetime_values:

              print(
                  "No ISO-style datetime values "
                  "were discovered in the first "
                  "10 records."
              )

          else:

              for path, raw_value, dt in (
                  all_datetime_values[:100]
              ):

                  location = ""

                  if (
                      dt < requested_start
                  ):

                      location = (
                          "BEFORE REQUESTED WINDOW"
                      )

                  elif (
                      dt <= requested_end
                  ):

                      location = (
                          "INSIDE REQUESTED WINDOW"
                      )

                  else:

                      location = (
                          "AFTER REQUESTED WINDOW"
                      )

                  print(
                      f"{path}"
                  )

                  print(
                      f"  Raw: {raw_value}"
                  )

                  print(
                      f"  UTC: {dt.isoformat()}"
                  )

                  print(
                      f"  Position: {location}"
                  )

                  print()

          # ==================================================
          # RAW PAYLOAD SUMMARY
          # ==================================================

          print()
          print(
              "PAYLOAD SUMMARY"
          )
          print("-" * 70)

          if isinstance(payload, dict):

              for key, value in payload.items():

                  if isinstance(value, list):

                      print(
                          f"{key}: "
                          f"list[{len(value)}]"
                      )

                  elif isinstance(value, dict):

                      print(
                          f"{key}: "
                          f"object with "
                          f"{len(value)} keys"
                      )

                  else:

                      print(
                          f"{key}: "
                          f"{type(value).__name__} "
                          f"= {repr(value)[:200]}"
                      )

          elif isinstance(payload, list):

              print(
                  f"Top-level list containing "
                  f"{len(payload)} items."
              )

          else:

              print(
                  repr(payload)[:1000]
              )

          # ==================================================
          # CONCLUSION
          # ==================================================

          print()
          print("=" * 70)
          print("TEST 3 RESULT")
          print("=" * 70)
          print()

          if len(raw_text.strip()) == 0:

              print(
                  "RESULT: EMPTY HTTP 200 RESPONSE"
              )

              print()
              print(
                  "The API returned HTTP 200 but "
                  "no response body."
              )

          elif not isinstance(
              payload,
              (dict, list),
          ):

              print(
                  "RESULT: UNEXPECTED JSON RESPONSE"
              )

          elif not records:

              print(
                  "RESULT: NO RECORDS IDENTIFIED"
              )

              print()
              print(
                  "The request was accepted and "
                  "returned HTTP 200, but no "
                  "record collection was identified."
              )

              print()
              print(
                  "This means the next investigation "
                  "should focus on the API response "
                  "contract rather than changing "
                  "the production date filtering."
              )

          else:

              print(
                  f"RESULT: {len(records)} "
                  f"RECORDS IDENTIFIED"
              )

              print()
              print(
                  "Removing closureType=planned "
                  "produced data."
              )

              print()
              print(
                  "The raw record structure and "
                  "datetime paths above should now "
                  "tell us exactly how the API "
                  "represents closures."
              )

          # ==================================================
          # FINAL SAFETY STATEMENT
          # ==================================================

          print()
          print("=" * 70)
          print("TEST COMPLETE")
          print("=" * 70)
          print()
          print(
              "Exactly one API request was made."
          )
          print(
              "No retries were performed."
          )
          print(
              "No request splitting was performed."
          )
          print(
              "closureType was NOT supplied."
          )
          print(
              "Production workflow was not modified."
          )
          PY
