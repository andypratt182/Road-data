name: Test API Pagination - Two Pages

on:
  workflow_dispatch:

jobs:
  test-api-pagination:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run controlled two-page pagination test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # --------------------------------------------------
          # CONTROLLED TEST WINDOW
          # --------------------------------------------------

          start_string = "2026-08-11T00:00:00"
          end_string = "2026-08-18T23:59:59"

          params = {
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          TARGET_ROADS = {
              "M6",
              "M57",
              "M58",
              "M62",
          }

          print("=" * 70)
          print("NATIONAL HIGHWAYS TEST 6")
          print("CONTROLLED TWO-PAGE PAGINATION TEST")
          print("=" * 70)
          print()
          print("THIS TEST MAKES EXACTLY TWO API REQUESTS.")
          print("NO RETRIES.")
          print("NO REQUEST SPLITTING.")
          print("NO THIRD REQUEST.")
          print()
          print("PURPOSE:")
          print(
              "Confirm that the x-next URL returned by page 1 "
              "actually retrieves a different second page."
          )
          print()
          print("IMPORTANT:")
          print("closureType is intentionally NOT supplied.")
          print("pageCursor is NOT manually supplied.")
          print("The page 2 URL will be taken directly from x-next.")
          print()
          print("REQUEST WINDOW")
          print("-" * 70)
          print(f"Start: {start_string}")
          print(f"End:   {end_string}")
          print()
          print("Initial parameters:")
          print(json.dumps(params, indent=2))
          print()

          # --------------------------------------------------
          # REQUEST COUNTER
          # --------------------------------------------------

          request_count = 0

          session = requests.Session()

          # --------------------------------------------------
          # DATEX II EXTRACTION
          # --------------------------------------------------

          def extract_records(payload):

              records = []

              if not isinstance(payload, dict):
                  return records

              d2payload = payload.get(
                  "D2Payload"
              )

              if not isinstance(
                  d2payload,
                  dict,
              ):
                  return records

              situations = d2payload.get(
                  "situation",
                  []
              )

              if not isinstance(
                  situations,
                  list,
              ):
                  return records

              for situation in situations:

                  if not isinstance(
                      situation,
                      dict,
                  ):
                      continue

                  situation_records = situation.get(
                      "situationRecord",
                      []
                  )

                  if not isinstance(
                      situation_records,
                      list,
                  ):
                      continue

                  records.extend(
                      situation_records
                  )

              return records

          # --------------------------------------------------
          # RECORD ID
          # --------------------------------------------------

          def get_record_id(record):

              if not isinstance(
                  record,
                  dict,
              ):
                  return None

              # Most DATEX II records use idG.
              if record.get("idG"):
                  return str(
                      record["idG"]
                  )

              # Fallbacks for diagnostic purposes.
              for key in (
                  "id",
                  "recordId",
                  "situationRecordId",
              ):

                  if record.get(key):
                      return str(
                          record[key]
                      )

              return None

          # --------------------------------------------------
          # ROAD EXTRACTION
          # --------------------------------------------------

          def extract_roads(record):

              found = set()

              if not isinstance(
                  record,
                  dict,
              ):
                  return found

              def walk(obj):

                  if isinstance(
                      obj,
                      dict,
                  ):

                      for key, value in obj.items():

                          key_lower = str(
                              key
                          ).lower()

                          if key_lower in {
                              "roadname",
                              "roadnumber",
                          }:

                              if value:

                                  text = str(
                                      value
                                  ).strip().upper()

                                  # Normalise obvious
                                  # road-number forms.
                                  text = text.replace(
                                      " ",
                                      "",
                                  )

                                  found.add(
                                      text
                                  )

                          walk(value)

                  elif isinstance(
                      obj,
                      list,
                  ):

                      for item in obj:
                          walk(item)

              walk(record)

              return found

          # --------------------------------------------------
          # PAGE ANALYSIS
          # --------------------------------------------------

          def analyse_page(
              page_number,
              response,
              payload,
          ):

              print("=" * 70)
              print(
                  f"PAGE {page_number} ANALYSIS"
              )
              print("=" * 70)
              print()

              records = extract_records(
                  payload
              )

              print(
                  f"HTTP status: "
                  f"{response.status_code}"
              )

              print()

              print(
                  f"Response characters: "
                  f"{len(response.text)}"
              )

              print()

              print(
                  f"Situation records: "
                  f"{len(records)}"
              )

              print()

              ids = []

              records_without_ids = 0

              for record in records:

                  record_id = get_record_id(
                      record
                  )

                  if record_id:

                      ids.append(
                          record_id
                      )

                  else:

                      records_without_ids += 1

              duplicate_ids = [
                  record_id
                  for record_id, count
                  in Counter(ids).items()
                  if count > 1
              ]

              print(
                  f"Records with IDs: "
                  f"{len(ids)}"
              )

              print(
                  f"Records without IDs: "
                  f"{records_without_ids}"
              )

              print(
                  f"Duplicate IDs within page: "
                  f"{len(duplicate_ids)}"
              )

              print()

              # --------------------------------------------------
              # TARGET ROAD ANALYSIS
              # --------------------------------------------------

              target_counts = Counter()

              for record in records:

                  roads = extract_roads(
                      record
                  )

                  for road in roads:

                      if road in TARGET_ROADS:

                          target_counts[
                              road
                          ] += 1

              print(
                  "TARGET ROAD RECORDS"
              )
              print("-" * 70)

              if target_counts:

                  for road, count in sorted(
                      target_counts.items()
                  ):

                      print(
                          f"{road}: {count}"
                      )

              else:

                  print(
                      "No M6/M57/M58/M62 "
                      "road fields identified."
                  )

              print()

              # --------------------------------------------------
              # x-next
              # --------------------------------------------------

              next_url = response.headers.get(
                  "x-next"
              )

              print(
                  "x-next:"
              )

              if next_url:

                  print(
                      next_url
                  )

              else:

                  print(
                      "NOT PRESENT"
                  )

              print()

              return {
                  "records": records,
                  "ids": set(ids),
                  "next_url": next_url,
                  "target_counts": target_counts,
              }

          # ==================================================
          # REQUEST 1: FIRST PAGE
          # ==================================================

          print("=" * 70)
          print("REQUEST 1 OF 2 - FIRST PAGE")
          print("=" * 70)
          print()

          request_count += 1

          response1 = session.get(
              API_URL,
              params=params,
              headers=headers,
              timeout=60,
          )

          print(
              f"Request count: "
              f"{request_count}"
          )

          print()

          if response1.status_code == 429:

              print(
                  "RATE LIMIT RECEIVED."
              )

              print(
                  "Retry-After:",
                  response1.headers.get(
                      "Retry-After",
                      "not supplied",
                  )
              )

              print()
              print(
                  "No retry performed."
              )

              raise SystemExit(1)

          if response1.status_code != 200:

              print(
                  "FIRST REQUEST FAILED."
              )

              print(
                  response1.text[:5000]
              )

              raise SystemExit(1)

          print(
              "Final URL:"
          )
          print(
              response1.url
          )
          print()

          try:

              payload1 = response1.json()

          except Exception as exc:

              print(
                  "Unable to parse page 1 JSON:"
              )
              print(exc)

              raise SystemExit(1)

          page1 = analyse_page(
              1,
              response1,
              payload1,
          )

          next_url = page1[
              "next_url"
          ]

          # ==================================================
          # REQUIRE x-next FOR PAGE 2
          # ==================================================

          if not next_url:

              print("=" * 70)
              print(
                  "TEST STOPPED SAFELY"
              )
              print("=" * 70)
              print()
              print(
                  "Page 1 did not contain an x-next "
                  "header."
              )
              print()
              print(
                  "Therefore page 2 was NOT requested."
              )
              print()
              print(
                  f"Exactly {request_count} "
                  "API request was made."
              )
              print(
                  "No retry was performed."
              )
              print(
                  "No request splitting was performed."
              )
              print()
              print(
                  "RESULT: PAGINATION COULD NOT "
                  "BE TESTED BEYOND PAGE 1."
              )

              raise SystemExit(1)

          # ==================================================
          # REQUEST 2: FOLLOW x-next
          # ==================================================

          print("=" * 70)
          print("REQUEST 2 OF 2 - FOLLOW x-next")
          print("=" * 70)
          print()

          print(
              "Following the exact x-next URL "
              "returned by page 1."
          )

          print()

          request_count += 1

          response2 = session.get(
              next_url,
              headers=headers,
              timeout=60,
          )

          print(
              f"Request count: "
              f"{request_count}"
          )

          print()

          if response2.status_code == 429:

              print(
                  "RATE LIMIT RECEIVED."
              )

              print(
                  "Retry-After:",
                  response2.headers.get(
                      "Retry-After",
                      "not supplied",
                  )
              )

              print()
              print(
                  "No retry performed."
              )

              raise SystemExit(1)

          if response2.status_code != 200:

              print(
                  "SECOND REQUEST FAILED."
              )

              print(
                  response2.text[:5000]
              )

              raise SystemExit(1)

          print(
              "Final URL:"
          )
          print(
              response2.url
          )
          print()

          try:

              payload2 = response2.json()

          except Exception as exc:

              print(
                  "Unable to parse page 2 JSON:"
              )
              print(exc)

              raise SystemExit(1)

          page2 = analyse_page(
              2,
              response2,
              payload2,
          )

          # ==================================================
          # PAGE COMPARISON
          # ==================================================

          print("=" * 70)
          print("PAGE COMPARISON")
          print("=" * 70)
          print()

          ids1 = page1["ids"]
          ids2 = page2["ids"]

          common_ids = ids1 & ids2

          page1_only = ids1 - ids2
          page2_only = ids2 - ids1

          print(
              f"Page 1 IDs: "
              f"{len(ids1)}"
          )

          print(
              f"Page 2 IDs: "
              f"{len(ids2)}"
          )

          print(
              f"IDs appearing on BOTH pages: "
              f"{len(common_ids)}"
          )

          print(
              f"IDs unique to page 1: "
              f"{len(page1_only)}"
          )

          print(
              f"IDs unique to page 2: "
              f"{len(page2_only)}"
          )

          print()

          if common_ids:

              print(
                  "WARNING: Some record IDs "
                  "appear on both pages."
              )

              print()

              print(
                  "First duplicate IDs:"
              )

              for record_id in sorted(
                  common_ids
              )[:20]:

                  print(
                      f"- {record_id}"
                  )

          else:

              print(
                  "No record IDs overlap "
                  "between page 1 and page 2."
              )

          print()

          # --------------------------------------------------
          # RECORD COUNT COMPARISON
          # --------------------------------------------------

          records1 = page1["records"]
          records2 = page2["records"]

          print(
              "RECORD COUNT COMPARISON"
          )
          print("-" * 70)

          print(
              f"Page 1: {len(records1)}"
          )

          print(
              f"Page 2: {len(records2)}"
          )

          print()

          # --------------------------------------------------
          # SECOND PAGE x-next
          # --------------------------------------------------

          page2_next = page2[
              "next_url"
          ]

          print(
              "PAGE 2 x-next:"
          )

          if page2_next:

              print(
                  "PRESENT"
              )

              print()
              print(
                  "This proves that pagination "
                  "continues beyond page 2."
              )

              print()
              print(
                  "IMPORTANT: The third page "
                  "WAS NOT requested."
              )

          else:

              print(
                  "NOT PRESENT"
              )

              print()
              print(
                  "The API did not advertise "
                  "a third page."
              )

          print()

          # ==================================================
          # FINAL RESULT
          # ==================================================

          print("=" * 70)
          print("TEST 6 RESULT")
          print("=" * 70)
          print()

          if (
              len(records1) > 0
              and len(records2) > 0
              and not common_ids
          ):

              print(
                  "RESULT: PAGINATION BEHAVIOUR "
                  "CONFIRMED."
              )

              print()
              print(
                  "Page 1 and page 2 contain "
                  "different situation records."
              )

          elif (
              len(records1) > 0
              and len(records2) > 0
              and common_ids
          ):

              print(
                  "RESULT: PAGE 2 WAS RETRIEVED, "
                  "BUT SOME RECORD IDs OVERLAP."
              )

              print(
                  "Further investigation may be "
                  "required before production use."
              )

          elif len(records2) == 0:

              print(
                  "RESULT: PAGE 2 RETURNED ZERO "
                  "SITUATION RECORDS."
              )

          else:

              print(
                  "RESULT: INCONCLUSIVE."
              )

          print()
          print(
              f"Exactly {request_count} "
              "API requests were made."
          )
          print(
              "No retries were performed."
          )
          print(
              "No request splitting was performed."
          )
          print(
              "No third request was made."
          )
          print(
              "Page 2 was obtained exclusively "
              "using the x-next URL supplied "
              "by page 1."
          )
          print(
              "Production workflow was not modified."
          )
          print()
          print(
              "TEST COMPLETE."
          )
          PY
