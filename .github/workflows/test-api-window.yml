```yaml
name: Test National Highways API Date Window

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-date-window:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test 7-day planned closure window
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timedelta, timezone

          import requests

          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          now = datetime.now(
              timezone.utc
          ).replace(microsecond=0)

          end = now + timedelta(days=7)

          start_string = (
              now.isoformat()
              .replace("+00:00", "Z")
          )

          end_string = (
              end.isoformat()
              .replace("+00:00", "Z")
          )

          params = {
              "closureType": "planned",
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          print("=" * 70)
          print("NATIONAL HIGHWAYS API DATE WINDOW TEST")
          print("=" * 70)

          print()
          print("This workflow makes ONE API request only.")
          print()

          print("Start:")
          print(start_string)

          print()
          print("End:")
          print(end_string)

          print()
          print("Parameters:")
          print(
              json.dumps(
                  params,
                  indent=2,
              )
          )

          print()
          print("Requesting API...")
          print()

          response = requests.get(
              API_URL,
              params=params,
              headers=headers,
              timeout=60,
          )

          print("=" * 70)
          print("RESULT")
          print("=" * 70)

          print()
          print(
              f"HTTP status: "
              f"{response.status_code}"
          )

          print()
          print("Final URL:")
          print(response.url)

          print()
          print("Relevant response headers:")

          for key, value in response.headers.items():

              if key.lower() in {
                  "content-type",
                  "retry-after",
                  "x-ratelimit-limit",
                  "x-ratelimit-remaining",
                  "x-ratelimit-reset",
              }:

                  print(
                      f"  {key}: {value}"
                  )

          print()
          print("Response body:")

          body = response.text

          if len(body) > 10000:
              body = (
                  body[:10000]
                  + "\n...[truncated]"
              )

          print(body)

          if response.status_code == 200:

              try:

                  payload = response.json()

                  record_count = None

                  if isinstance(
                      payload,
                      list,
                  ):

                      record_count = len(payload)

                  elif isinstance(
                      payload,
                      dict,
                  ):

                      for key in (
                          "closures",
                          "results",
                          "items",
                          "value",
                          "data",
                      ):

                          value = payload.get(key)

                          if isinstance(
                              value,
                              list,
                          ):

                              record_count = len(value)
                              break

                  print()
                  print("=" * 70)
                  print("DATE FILTER TEST: SUCCESS")
                  print("=" * 70)

                  if record_count is not None:

                      print()
                      print(
                          f"Records returned: "
                          f"{record_count}"
                      )

                  print()
                  print(
                      "The API accepted both "
                      "startDateTime and "
                      "endDateTime."
                  )

                  print(
                      "We can now proceed to test "
                      "the 500-record behaviour."
                  )

              except Exception as exc:

                  print()
                  print(
                      "HTTP 200 received, but the "
                      "response could not be analysed."
                  )

                  print(
                      f"Analysis error: {exc}"
                  )

          elif response.status_code == 422:

              print()
              print("=" * 70)
              print("DATE FILTER TEST: 422")
              print("=" * 70)

              print()
              print(
                  "The API rejected the date-window "
                  "request."
              )

              print(
                  "The response above should explain "
                  "which parameter or format is invalid."
              )

          elif response.status_code == 429:

              print()
              print("=" * 70)
              print("DATE FILTER TEST: RATE LIMITED")
              print("=" * 70)

              retry_after = response.headers.get(
                  "Retry-After",
                  "unknown",
              )

              print()
              print(
                  f"Retry-After: {retry_after}"
              )

              print()
              print(
                  "No retry was attempted."
              )

              print(
                  "Run this workflow again after "
                  "the indicated period."
              )

          else:

              print()
              print("=" * 70)
              print("DATE FILTER TEST: UNEXPECTED STATUS")
              print("=" * 70)

              print()
              print(
                  "The API returned an unexpected "
                  "HTTP status."
              )

          print()
          print("=" * 70)
          print("TEST COMPLETE")
          print("=" * 70)

          print()
          print(
              "Production workflows were not modified."
          )
          PY
```
