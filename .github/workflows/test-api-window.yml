name: Test API Window Overlap

on:
  workflow_dispatch:

jobs:
  test-api-window:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Test 9 overlap diagnostic
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # --------------------------------------------------
          # TEST WINDOW
          # --------------------------------------------------

          START_STRING = "2026-08-11T00:00:00"
          END_STRING = "2026-08-18T23:59:59"

          REQUESTED_START = datetime.fromisoformat(
              START_STRING
          ).replace(
              tzinfo=timezone.utc
          )

          REQUESTED_END = datetime.fromisoformat(
              END_STRING
          ).replace(
              tzinfo=timezone.utc
          )

          params = {
              "startDateTime": START_STRING,
              "endDateTime": END_STRING,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          # --------------------------------------------------
          # TARGET ROADS
          # --------------------------------------------------

          TARGET_ROADS = {
              "M6",
              "M57",
              "M58",
              "M62",
          }

          # --------------------------------------------------
          # HELPERS
          # --------------------------------------------------

          def parse_datetime(value):

              if not value:
                  return None

              text = str(value).strip()

              if text.endswith("Z"):
                  text = (
                      text[:-1]
                      + "+00:00"
                  )

              try:

                  dt = datetime.fromisoformat(
                      text
                  )

              except ValueError:

                  return None

              if dt.tzinfo is None:

                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              else:

                  dt = dt.astimezone(
                      timezone.utc
                  )

              return dt


          def road_names_from_record(record):

              roads = set()

              def walk(value):

                  if isinstance(value, dict):

                      # Direct roadName fields.
                      road_name = value.get(
                          "roadName"
                      )

                      if road_name:

                          roads.add(
                              str(road_name).strip()
                          )

                      for child in value.values():

                          walk(child)

                  elif isinstance(value, list):

                      for child in value:

                          walk(child)

              walk(record)

              return roads


          def get_comment(record):

              comments = []

              def walk(value):

                  if isinstance(value, dict):

                      comment = value.get(
                          "comment"
                      )

                      if comment:

                          comments.append(
                              str(comment)
                          )

                      for child in value.values():

                          walk(child)

                  elif isinstance(value, list):

                      for child in value:

                          walk(child)

              walk(record)

              if comments:

                  return " | ".join(
                      comments[:3]
                  )

              return ""


          def get_validity(record):

              """
              Locate:

              validity
                validityTimeSpecification
                  overallStartTime
                  overallEndTime
              """

              matches = []

              def walk(value):

                  if isinstance(value, dict):

                      validity = value.get(
                          "validity"
                      )

                      if isinstance(
                          validity,
                          dict,
                      ):

                          specification = (
                              validity.get(
                                  "validityTimeSpecification"
                              )
                          )

                          if isinstance(
                              specification,
                              dict,
                          ):

                              start = (
                                  specification.get(
                                      "overallStartTime"
                                  )
                              )

                              end = (
                                  specification.get(
                                      "overallEndTime"
                                  )
                              )

                              if start or end:

                                  matches.append(
                                      (
                                          start,
                                          end,
                                      )
                                  )

                      for child in value.values():

                          walk(child)

                  elif isinstance(value, list):

                      for child in value:

                          walk(child)

              walk(record)

              if matches:

                  return matches[0]

              return None, None


          def record_id(record):

              """
              Locate common National Highways/DATEX
              situation record identifiers.
              """

              candidates = (
                  "idG",
                  "id",
                  "situationRecordId",
              )

              found = []

              def walk(value):

                  if isinstance(value, dict):

                      for key in candidates:

                          if key in value:

                              found.append(
                                  str(
                                      value[key]
                                  )
                              )

                      for child in value.values():

                          walk(child)

                  elif isinstance(value, list):

                      for child in value:

                          walk(child)

              walk(record)

              if found:

                  return found[0]

              return None


          def overlap_type(
              closure_start,
              closure_end,
          ):

              if (
                  closure_start is None
                  or closure_end is None
              ):

                  return "UNKNOWN"

              # Completely before requested window.
              if closure_end < REQUESTED_START:

                  return "BEFORE"

              # Completely after requested window.
              if closure_start > REQUESTED_END:

                  return "AFTER"

              # Starts before/equal and ends after/equal.
              if (
                  closure_start <= REQUESTED_START
                  and closure_end >= REQUESTED_END
              ):

                  return "CONTAINS_REQUESTED_WINDOW"

              # Starts before requested window and
              # ends inside it.
              if (
                  closure_start < REQUESTED_START
                  and closure_end >= REQUESTED_START
                  and closure_end <= REQUESTED_END
              ):

                  return "OVERLAPS_START"

              # Starts inside requested window and
              # ends after it.
              if (
                  closure_start >= REQUESTED_START
                  and closure_start <= REQUESTED_END
                  and closure_end > REQUESTED_END
              ):

                  return "OVERLAPS_END"

              # Both start and end are inside.
              if (
                  REQUESTED_START
                  <= closure_start
                  <= REQUESTED_END
                  and
                  REQUESTED_START
                  <= closure_end
                  <= REQUESTED_END
              ):

                  return "FULLY_INSIDE"

              return "OVERLAPS"


          # ==================================================
          # HEADER
          # ==================================================

          print("=" * 70)
          print("TEST 9")
          print("NATIONAL HIGHWAYS DATE WINDOW OVERLAP DIAGNOSTIC")
          print("=" * 70)
          print()

          print(
              "PURPOSE:"
          )

          print(
              "Determine how startDateTime/endDateTime "
              "relate to the actual closure validity period."
          )

          print()

          print(
              "THIS TEST MAKES EXACTLY ONE API REQUEST."
          )

          print(
              "NO RETRIES."
          )

          print(
              "NO REQUEST SPLITTING."
          )

          print(
              "NO PAGINATION."
          )

          print(
              "x-next WILL NOT be followed."
          )

          print()

          print(
              "closureType is NOT supplied."
          )

          print()

          print(
              "REQUEST WINDOW"
          )

          print("-" * 70)

          print(
              f"Start: {START_STRING}"
          )

          print(
              f"End:   {END_STRING}"
          )

          print()

          print(
              "Parameters:"
          )

          print(
              json.dumps(
                  params,
                  indent=2,
              )
          )

          print()

          print(
              "Requesting API..."
          )

          print()

          # ==================================================
          # EXACTLY ONE REQUEST
          # ==================================================

          try:

              response = requests.get(
                  API_URL,
                  params=params,
                  headers=headers,
                  timeout=60,
              )

          except Exception as exc:

              print(
                  "REQUEST FAILED"
              )

              print(
                  str(exc)
              )

              print()

              print(
                  "NO RETRY WILL BE PERFORMED."
              )

              raise SystemExit(1)

          # ==================================================
          # RESPONSE
          # ==================================================

          print(
              f"HTTP status: "
              f"{response.status_code}"
          )

          print()

          print(
              "Final URL:"
          )

          print(
              response.url
          )

          print()

          print(
              "Response characters:"
          )

          print(
              len(response.text)
          )

          print()

          if response.status_code == 429:

              print(
                  "RATE LIMIT RECEIVED."
              )

              print()

              print(
                  "Retry-After:"
              )

              print(
                  response.headers.get(
                      "Retry-After",
                      "not supplied",
                  )
              )

              print()

              print(
                  "NO RETRY WILL BE PERFORMED."
              )

              raise SystemExit(1)

          if response.status_code != 200:

              print(
                  "REQUEST FAILED."
              )

              print()

              print(
                  response.text[:5000]
              )

              raise SystemExit(1)

          # ==================================================
          # x-next
          # ==================================================

          x_next = response.headers.get(
              "x-next"
          )

          print(
              "x-next:"
          )

          if x_next:

              print(
                  x_next
              )

              print()

              print(
                  "x-next was NOT followed."
              )

          else:

              print(
                  "NOT PRESENT"
              )

          print()

          # ==================================================
          # JSON
          # ==================================================

          try:

              payload = response.json()

          except Exception as exc:

              print(
                  "Unable to decode JSON."
              )

              print(
                  str(exc)
              )

              print()

              print(
                  response.text[:5000]
              )

              raise SystemExit(1)

          # ==================================================
          # EXTRACT D2PAYLOAD
          # ==================================================

          if not isinstance(
              payload,
              dict,
          ):

              print(
                  "Unexpected top-level JSON type."
              )

              raise SystemExit(1)

          d2payload = payload.get(
              "D2Payload"
          )

          if not isinstance(
              d2payload,
              dict,
          ):

              print(
                  "D2Payload was not found."
              )

              raise SystemExit(1)

          situations = d2payload.get(
              "situation",
              [],
          )

          if not isinstance(
              situations,
              list,
          ):

              print(
                  "D2Payload.situation is not a list."
              )

              raise SystemExit(1)

          # ==================================================
          # EXTRACT RECORDS
          # ==================================================

          records = []

          for situation in situations:

              if not isinstance(
                  situation,
                  dict,
              ):
                  continue

              situation_records = situation.get(
                  "situationRecord",
                  [],
              )

              if not isinstance(
                  situation_records,
                  list,
              ):
                  continue

              records.extend(
                  situation_records
              )

          print(
              "=" * 70
          )

          print(
              "PAYLOAD"
          )

          print(
              "=" * 70
          )

          print()

          print(
              f"Situation groups: "
              f"{len(situations)}"
          )

          print(
              f"Situation records: "
              f"{len(records)}"
          )

          print()

          # ==================================================
          # OVERLAP COUNTERS
          # ==================================================

          counts = {
              "BEFORE": 0,
              "AFTER": 0,
              "FULLY_INSIDE": 0,
              "OVERLAPS_START": 0,
              "OVERLAPS_END": 0,
              "CONTAINS_REQUESTED_WINDOW": 0,
              "OVERLAPS": 0,
              "UNKNOWN": 0,
          }

          target_counts = {
              road: {
                  key: 0
                  for key in counts
              }
              for road in sorted(
                  TARGET_ROADS
              )
          }

          target_total = {
              road: 0
              for road in sorted(
                  TARGET_ROADS
              )
          }

          sample_before = []
          sample_after = []
          sample_unknown = []

          # ==================================================
          # RECORD ANALYSIS
          # ==================================================

          for record in records:

              if not isinstance(
                  record,
                  dict,
              ):
                  continue

              raw_start, raw_end = (
                  get_validity(
                      record
                  )
              )

              closure_start = parse_datetime(
                  raw_start
              )

              closure_end = parse_datetime(
                  raw_end
              )

              classification = overlap_type(
                  closure_start,
                  closure_end,
              )

              counts[
                  classification
              ] += 1

              roads = road_names_from_record(
                  record
              )

              target_matches = (
                  TARGET_ROADS
                  & roads
              )

              for road in target_matches:

                  target_total[
                      road
                  ] += 1

                  target_counts[
                      road
                  ][
                      classification
                  ] += 1

              sample_data = {
                  "id": record_id(
                      record
                  ),
                  "roads": sorted(
                      roads
                  ),
                  "start": raw_start,
                  "end": raw_end,
                  "classification": classification,
                  "comment": get_comment(
                      record
                  ),
              }

              if (
                  classification == "BEFORE"
                  and len(sample_before) < 5
              ):

                  sample_before.append(
                      sample_data
                  )

              if (
                  classification == "AFTER"
                  and len(sample_after) < 5
              ):

                  sample_after.append(
                      sample_data
                  )

              if (
                  classification == "UNKNOWN"
                  and len(sample_unknown) < 5
              ):

                  sample_unknown.append(
                      sample_data
                  )

          # ==================================================
          # OVERALL RESULTS
          # ==================================================

          print(
              "OVERLAP ANALYSIS"
          )

          print("-" * 70)

          for classification, count in counts.items():

              print(
                  f"{classification}: "
                  f"{count}"
              )

          print()

          overlapping = (
              len(records)
              - counts["BEFORE"]
              - counts["AFTER"]
              - counts["UNKNOWN"]
          )

          comparable = (
              len(records)
              - counts["UNKNOWN"]
          )

          print(
              f"Records with usable validity: "
              f"{comparable}"
          )

          print(
              f"Records overlapping requested "
              f"window: {overlapping}"
          )

          print()

          # ==================================================
          # TARGET ROADS
          # ==================================================

          print(
              "=" * 70
          )

          print(
              "TARGET ROAD ANALYSIS"
          )

          print(
              "=" * 70
          )

          print()

          for road in sorted(
              TARGET_ROADS
          ):

              print(
                  f"{road}: "
                  f"{target_total[road]} records"
              )

              for classification, count in (
                  target_counts[
                      road
                  ].items()
              ):

                  print(
                      f"  {classification}: "
                      f"{count}"
                  )

              print()

          # ==================================================
          # SAMPLE BEFORE
          # ==================================================

          print(
              "=" * 70
          )

          print(
              "SAMPLE RECORDS STARTING/ENDING BEFORE WINDOW"
          )

          print(
              "=" * 70
          )

          if not sample_before:

              print(
                  "No records classified BEFORE."
              )

          else:

              for number, item in enumerate(
                  sample_before,
                  start=1,
              ):

                  print()

                  print(
                      f"Record {number}"
                  )

                  print(
                      f"ID: {item['id']}"
                  )

                  print(
                      f"Roads: "
                      f"{', '.join(item['roads'])}"
                  )

                  print(
                      f"Start: "
                      f"{item['start']}"
                  )

                  print(
                      f"End: "
                      f"{item['end']}"
                  )

                  print(
                      f"Classification: "
                      f"{item['classification']}"
                  )

                  print(
                      f"Comment: "
                      f"{item['comment']}"
                  )

          # ==================================================
          # SAMPLE AFTER
          # ==================================================

          print()

          print(
              "=" * 70
          )

          print(
              "SAMPLE RECORDS STARTING AFTER WINDOW"
          )

          print(
              "=" * 70
          )

          if not sample_after:

              print(
                  "No records classified AFTER."
              )

          else:

              for number, item in enumerate(
                  sample_after,
                  start=1,
              ):

                  print()

                  print(
                      f"Record {number}"
                  )

                  print(
                      f"ID: {item['id']}"
                  )

                  print(
                      f"Roads: "
                      f"{', '.join(item['roads'])}"
                  )

                  print(
                      f"Start: "
                      f"{item['start']}"
                  )

                  print(
                      f"End: "
                      f"{item['end']}"
                  )

                  print(
                      f"Classification: "
                      f"{item['classification']}"
                  )

                  print(
                      f"Comment: "
                      f"{item['comment']}"
                  )

          # ==================================================
          # SAMPLE UNKNOWN
          # ==================================================

          print()

          print(
              "=" * 70
          )

          print(
              "SAMPLE RECORDS WITH UNKNOWN VALIDITY"
          )

          print(
              "=" * 70
          )

          if not sample_unknown:

              print(
                  "No unknown validity records."
              )

          else:

              for number, item in enumerate(
                  sample_unknown,
                  start=1,
              ):

                  print()

                  print(
                      f"Record {number}"
                  )

                  print(
                      f"ID: {item['id']}"
                  )

                  print(
                      f"Roads: "
                      f"{', '.join(item['roads'])}"
                  )

                  print(
                      f"Start: "
                      f"{item['start']}"
                  )

                  print(
                      f"End: "
                      f"{item['end']}"
                  )

                  print(
                      f"Classification: "
                      f"{item['classification']}"
                  )

                  print(
                      f"Comment: "
                      f"{item['comment']}"
                  )

          # ==================================================
          # FINAL INTERPRETATION
          # ==================================================

          print()

          print(
              "=" * 70
          )

          print(
              "TEST 9 RESULT"
          )

          print(
              "=" * 70
          )

          print()

          if len(records) == 0:

              print(
                  "RESULT: INCONCLUSIVE."
              )

              print(
                  "The API returned zero "
                  "situation records."
              )

          elif comparable == 0:

              print(
                  "RESULT: INCONCLUSIVE."
              )

              print(
                  "Records were returned but "
                  "no usable overallStartTime/"
                  "overallEndTime values were found."
              )

          else:

              print(
                  f"Returned records: "
                  f"{len(records)}"
              )

              print(
                  f"Records overlapping requested "
                  f"window: {overlapping}"
              )

              print(
                  f"Records entirely before window: "
                  f"{counts['BEFORE']}"
              )

              print(
                  f"Records entirely after window: "
                  f"{counts['AFTER']}"
              )

              print(
                  f"Records with unknown validity: "
                  f"{counts['UNKNOWN']}"
              )

              print()

              if counts["BEFORE"] > 0:

                  print(
                      "IMPORTANT: records ending "
                      "before the requested window "
                      "were returned."
                  )

              if counts["AFTER"] > 0:

                  print(
                      "IMPORTANT: records starting "
                      "after the requested window "
                      "were returned."
                  )

              print()

              if (
                  counts["BEFORE"] == 0
                  and counts["AFTER"] == 0
              ):

                  print(
                      "RESULT: ALL RECORDS WITH "
                      "USABLE VALIDITY OVERLAP "
                      "THE REQUESTED WINDOW."
                  )

                  print(
                      "This is consistent with "
                      "overlap-based filtering."
                  )

              elif (
                  counts["BEFORE"] > 0
                  or counts["AFTER"] > 0
              ):

                  print(
                      "RESULT: API RETURNED RECORDS "
                      "OUTSIDE THE REQUESTED "
                      "VALIDITY WINDOW."
                  )

                  print(
                      "startDateTime/endDateTime "
                      "therefore do not appear to "
                      "be a strict overlap filter."
                  )

          print()

          print(
              "IMPORTANT:"
          )

          print(
              "Exactly one API request was made."
          )

          print(
              "No retries were performed."
          )

          print(
              "No request splitting was performed."
          )

          print(
              "x-next was NOT followed."
          )

          print(
              "No PageCursor was supplied."
          )

          print(
              "closureType was NOT supplied."
          )

          print(
              "Production workflow was not modified."
          )

          print()

          print(
              "TEST 9 COMPLETE."
          )
          PY
