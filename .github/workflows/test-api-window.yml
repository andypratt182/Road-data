name: Test API Rate Limit

on:
  workflow_dispatch:

jobs:
  test-api-rate-limit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run controlled rate-limit diagnostic
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # --------------------------------------------------
          # CONTROLLED TEST WINDOW
          # --------------------------------------------------

          start_string = "2026-08-11T00:00:00"
          end_string = "2026-08-18T23:59:59"

          params = {
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          # --------------------------------------------------
          # TEST SETTINGS
          # --------------------------------------------------

          REQUEST_LIMIT = 6

          # Deliberately do NOT follow x-next.
          #
          # Each request is made against the SAME initial
          # endpoint so that this test measures request
          # throttling rather than pagination behaviour.
          #
          # No retry is ever attempted.
          #
          # A small delay is used between requests so that
          # we can observe whether the API exposes useful
          # rate-limit information without deliberately
          # hammering the service.
          DELAY_BETWEEN_REQUESTS = 5

          print("=" * 70)
          print("NATIONAL HIGHWAYS TEST 8")
          print("CONTROLLED RATE-LIMIT DIAGNOSTIC")
          print("=" * 70)
          print()
          print("PURPOSE:")
          print(
              "Determine how the National Highways API exposes "
              "rate-limit behaviour."
          )
          print()
          print("IMPORTANT:")
          print("closureType is NOT supplied.")
          print("x-next will NOT be followed.")
          print("pageCursor will NOT be supplied.")
          print("No request will be retried.")
          print()
          print(
              f"Maximum requests: {REQUEST_LIMIT}"
          )
          print(
              f"Delay between requests: "
              f"{DELAY_BETWEEN_REQUESTS} seconds"
          )
          print()
          print("REQUEST WINDOW")
          print("-" * 70)
          print(
              f"Start: {start_string}"
          )
          print(
              f"End:   {end_string}"
          )
          print()
          print(
              "Parameters:"
          )
          print(
              json.dumps(
                  params,
                  indent=2,
              )
          )
          print()

          # --------------------------------------------------
          # SESSION
          # --------------------------------------------------

          session = requests.Session()

          results = []

          # --------------------------------------------------
          # HELPER
          # --------------------------------------------------

          def utc_now():

              return datetime.now(
                  timezone.utc
              ).isoformat()

          # --------------------------------------------------
          # REQUEST LOOP
          # --------------------------------------------------

          for request_number in range(
              1,
              REQUEST_LIMIT + 1,
          ):

              print("=" * 70)
              print(
                  f"REQUEST {request_number}"
              )
              print("=" * 70)
              print()

              print(
                  "Request URL:"
              )

              print(
                  API_URL
              )

              print()

              request_started = time.monotonic()

              request_time = utc_now()

              try:

                  response = session.get(
                      API_URL,
                      params=params,
                      headers=headers,
                      timeout=60,
                  )

              except Exception as exc:

                  elapsed = (
                      time.monotonic()
                      - request_started
                  )

                  print(
                      "REQUEST EXCEPTION"
                  )

                  print(
                      str(exc)
                  )

                  print(
                      f"Elapsed: "
                      f"{elapsed:.3f} seconds"
                  )

                  print()

                  print(
                      "NO RETRY WILL BE PERFORMED."
                  )

                  raise SystemExit(1)

              elapsed = (
                  time.monotonic()
                  - request_started
              )

              # --------------------------------------------------
              # HEADERS
              # --------------------------------------------------

              retry_after = response.headers.get(
                  "Retry-After"
              )

              x_next = response.headers.get(
                  "x-next"
              )

              content_type = response.headers.get(
                  "Content-Type"
              )

              # Collect every header whose name may
              # contain useful rate-limit information.

              rate_headers = {}

              for key, value in response.headers.items():

                  lower_key = key.lower()

                  if (
                      "rate" in lower_key
                      or "limit" in lower_key
                      or "remaining" in lower_key
                      or "retry" in lower_key
                      or "quota" in lower_key
                      or "reset" in lower_key
                  ):

                      rate_headers[key] = value

              print(
                  f"Timestamp: "
                  f"{request_time}"
              )

              print(
                  f"HTTP status: "
                  f"{response.status_code}"
              )

              print(
                  f"Elapsed: "
                  f"{elapsed:.3f} seconds"
              )

              print(
                  f"Response characters: "
                  f"{len(response.text)}"
              )

              print()

              print(
                  "Content-Type:"
              )

              print(
                  content_type or "not supplied"
              )

              print()

              print(
                  "Retry-After:"
              )

              print(
                  retry_after or "not supplied"
              )

              print()

              print(
                  "x-next:"
              )

              if x_next:

                  print(
                      x_next
                  )

              else:

                  print(
                      "NOT PRESENT"
                  )

              print()

              print(
                  "RATE-LIMIT RELATED HEADERS"
              )
              print("-" * 70)

              if rate_headers:

                  for key, value in sorted(
                      rate_headers.items()
                  ):

                      print(
                          f"{key}: {value}"
                      )

              else:

                  print(
                      "No rate-limit-specific "
                      "headers identified."
                  )

              print()

              # --------------------------------------------------
              # SAVE RESULT
              # --------------------------------------------------

              results.append(
                  {
                      "request": request_number,
                      "timestamp": request_time,
                      "status": response.status_code,
                      "elapsed_seconds": round(
                          elapsed,
                          3,
                      ),
                      "response_characters": len(
                          response.text
                      ),
                      "retry_after": retry_after,
                      "x_next": bool(
                          x_next
                      ),
                      "rate_headers": rate_headers,
                  }
              )

              # --------------------------------------------------
              # RATE LIMIT
              # --------------------------------------------------

              if response.status_code == 429:

                  print("=" * 70)
                  print("RATE LIMIT DETECTED")
                  print("=" * 70)
                  print()

                  print(
                      "The API returned HTTP 429."
                  )

                  print()

                  print(
                      "Retry-After:"
                  )

                  print(
                      retry_after or "not supplied"
                  )

                  print()

                  print(
                      "The request will NOT be retried."
                  )

                  print(
                      "The diagnostic will stop immediately."
                  )

                  break

              # --------------------------------------------------
              # OTHER HTTP ERROR
              # --------------------------------------------------

              if response.status_code != 200:

                  print("=" * 70)
                  print("HTTP ERROR")
                  print("=" * 70)
                  print()

                  print(
                      response.text[:5000]
                  )

                  print()

                  print(
                      "NO RETRY WILL BE PERFORMED."
                  )

                  break

              # --------------------------------------------------
              # OPTIONAL RESPONSE VALIDATION
              # --------------------------------------------------

              try:

                  payload = response.json()

                  d2payload = (
                      payload.get(
                          "D2Payload"
                      )
                      if isinstance(
                          payload,
                          dict,
                      )
                      else None
                  )

                  if isinstance(
                      d2payload,
                      dict,
                  ):

                      situations = (
                          d2payload.get(
                              "situation",
                              [],
                          )
                      )

                      if isinstance(
                          situations,
                          list,
                      ):

                          record_count = 0

                          for situation in situations:

                              if not isinstance(
                                  situation,
                                  dict,
                              ):
                                  continue

                              records = (
                                  situation.get(
                                      "situationRecord",
                                      [],
                                  )
                              )

                              if isinstance(
                                  records,
                                  list,
                              ):

                                  record_count += len(
                                      records
                                  )

                          print(
                              f"Situation records: "
                              f"{record_count}"
                          )

                          print()

              except Exception:

                  print(
                      "Response JSON could not "
                      "be structurally inspected."
                  )

                  print()

              # --------------------------------------------------
              # DELAY
              # --------------------------------------------------

              if request_number < REQUEST_LIMIT:

                  print(
                      f"Waiting "
                      f"{DELAY_BETWEEN_REQUESTS} "
                      "seconds before next request..."
                  )

                  print()

                  time.sleep(
                      DELAY_BETWEEN_REQUESTS
                  )

          # ==================================================
          # FINAL SUMMARY
          # ==================================================

          print("=" * 70)
          print("TEST 8 RESULT")
          print("=" * 70)
          print()

          print(
              f"Requests attempted: "
              f"{len(results)}"
          )

          print()

          print(
              "REQUEST SUMMARY"
          )
          print("-" * 70)

          for result in results:

              print(
                  f"Request {result['request']}: "
                  f"HTTP {result['status']}, "
                  f"{result['elapsed_seconds']:.3f}s, "
                  f"{result['response_characters']} chars, "
                  f"Retry-After="
                  f"{result['retry_after'] or 'none'}, "
                  f"x-next="
                  f"{'YES' if result['x_next'] else 'NO'}"
              )

          print()

          # --------------------------------------------------
          # RETRY-AFTER SUMMARY
          # --------------------------------------------------

          retry_values = [
              result["retry_after"]
              for result in results
              if result["retry_after"]
          ]

          print(
              "RETRY-AFTER VALUES OBSERVED"
          )
          print("-" * 70)

          if retry_values:

              for value in retry_values:

                  print(
                      value
                  )

          else:

              print(
                  "None observed."
              )

          print()

          # --------------------------------------------------
          # RATE HEADER SUMMARY
          # --------------------------------------------------

          print(
              "RATE-LIMIT HEADERS OBSERVED"
          )
          print("-" * 70)

          combined_headers = {}

          for result in results:

              for key, value in result[
                  "rate_headers"
              ].items():

                  combined_headers.setdefault(
                      key,
                      set(),
                  ).add(
                      value
                  )

          if combined_headers:

              for key in sorted(
                  combined_headers
              ):

                  values = sorted(
                      combined_headers[key]
                  )

                  print(
                      f"{key}:"
                  )

                  for value in values:

                      print(
                          f"  {value}"
                      )

          else:

              print(
                  "No dedicated rate-limit "
                  "headers observed."
              )

          print()

          # --------------------------------------------------
          # CONCLUSION
          # --------------------------------------------------

          print("=" * 70)
          print("TEST 8 CONCLUSION")
          print("=" * 70)
          print()

          rate_limited = any(
              result["status"] == 429
              for result in results
          )

          if rate_limited:

              print(
                  "RESULT: RATE LIMIT CONFIRMED."
              )

              print()

              print(
                  "The API returned HTTP 429 "
                  "during the controlled request sequence."
              )

              print()

              if retry_values:

                  print(
                      "The API supplied Retry-After "
                      "information."
                  )

                  print(
                      "Production pagination should "
                      "honour that value rather than "
                      "using an arbitrary retry delay."
                  )

              else:

                  print(
                      "No Retry-After value was "
                      "observed in this sequence."
                  )

          else:

              print(
                  "RESULT: RATE LIMIT NOT REACHED "
                  "WITHIN THIS CONTROLLED TEST."
              )

              print()

              print(
                  f"{len(results)} requests completed "
                  "without HTTP 429."
              )

              print(
                  "This does NOT prove that pagination "
                  "has no rate limit."
              )

              print(
                  "It only establishes that the "
                  "controlled request pattern did not "
                  "trigger one."
              )

          print()

          print(
              "IMPORTANT:"
          )

          print(
              "x-next was deliberately NOT followed."
          )

          print(
              "pageCursor was NOT supplied."
          )

          print(
              "No retries were performed."
          )

          print(
              "No request splitting was performed."
          )

          print(
              "Production workflow was not modified."
          )

          print()

          print(
              "TEST 8 COMPLETE."
          )
          PY
