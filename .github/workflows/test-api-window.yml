name: Test API Pagination

on:
  workflow_dispatch:

jobs:
  test-api-pagination:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run single-request pagination diagnostic
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          # --------------------------------------------------
          # CONTROLLED TEST WINDOW
          # --------------------------------------------------

          start_string = "2026-08-11T00:00:00"
          end_string = "2026-08-18T23:59:59"

          params = {
              "startDateTime": start_string,
              "endDateTime": end_string,
          }

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          print("=" * 70)
          print("NATIONAL HIGHWAYS PAGINATION TEST")
          print("=" * 70)
          print()
          print("THIS TEST MAKES EXACTLY ONE API REQUEST.")
          print("NO RETRIES.")
          print("NO SPLITTING.")
          print("NO FOLLOWING OF x-next.")
          print()
          print("PURPOSE:")
          print(
              "Determine whether the live API returns an x-next "
              "pagination URL and whether the observed 500 records "
              "represent a paginated first page."
          )
          print()
          print("IMPORTANT:")
          print("closureType is intentionally NOT supplied.")
          print("pageCursor is intentionally NOT supplied.")
          print()
          print("REQUEST WINDOW")
          print("-" * 70)
          print(f"Start: {start_string}")
          print(f"End:   {end_string}")
          print()
          print("Parameters:")
          print(json.dumps(params, indent=2))
          print()
          print("Requesting API...")
          print()

          # --------------------------------------------------
          # EXACTLY ONE REQUEST
          # --------------------------------------------------

          response = requests.get(
              API_URL,
              params=params,
              headers=headers,
              timeout=60,
          )

          print(f"HTTP status: {response.status_code}")
          print()

          print("Final URL:")
          print(response.url)
          print()

          # --------------------------------------------------
          # RESPONSE HEADERS
          # --------------------------------------------------

          print("=" * 70)
          print("RESPONSE HEADERS")
          print("=" * 70)
          print()

          print("Content-Type:")
          print(
              response.headers.get(
                  "Content-Type",
                  "not supplied",
              )
          )

          print()

          print("x-next:")
          x_next = response.headers.get("x-next")

          if x_next:
              print(x_next)
          else:
              print("NOT PRESENT")

          print()

          print("All response headers:")
          for key, value in response.headers.items():
              print(f"{key}: {value}")

          print()

          # --------------------------------------------------
          # RATE LIMIT
          # --------------------------------------------------

          if response.status_code == 429:

              print("=" * 70)
              print("RATE LIMIT REACHED")
              print("=" * 70)
              print()

              print("Retry-After:")
              print(
                  response.headers.get(
                      "Retry-After",
                      "not supplied",
                  )
              )

              print()
              print(
                  "No retry was attempted."
              )

              raise SystemExit(1)

          # --------------------------------------------------
          # OTHER HTTP ERRORS
          # --------------------------------------------------

          if response.status_code != 200:

              print("=" * 70)
              print("REQUEST FAILED")
              print("=" * 70)
              print()

              print("Response body:")
              print(response.text[:5000])

              raise SystemExit(1)

          # --------------------------------------------------
          # RESPONSE SIZE
          # --------------------------------------------------

          print("=" * 70)
          print("RESPONSE SIZE")
          print("=" * 70)
          print()

          print(
              f"Response character count: "
              f"{len(response.text)}"
          )

          print()

          # --------------------------------------------------
          # RAW RESPONSE SAMPLE
          # --------------------------------------------------

          print("=" * 70)
          print("FIRST 3000 CHARACTERS OF RESPONSE")
          print("=" * 70)
          print()

          print(response.text[:3000])

          print()

          # --------------------------------------------------
          # JSON PARSE
          # --------------------------------------------------

          try:
              payload = response.json()

          except Exception as exc:

              print("=" * 70)
              print("JSON PARSE FAILED")
              print("=" * 70)
              print()

              print(exc)

              raise SystemExit(1)

          print("=" * 70)
          print("JSON STRUCTURE")
          print("=" * 70)
          print()

          print(
              "Top-level Python type:",
              type(payload).__name__,
          )

          if isinstance(payload, dict):

              print()
              print("Top-level keys:")

              for key in payload.keys():
                  print(f"- {key}")

          print()

          # --------------------------------------------------
          # DATEX II RECORD EXTRACTION
          # --------------------------------------------------

          records = []

          if isinstance(payload, dict):

              d2payload = payload.get(
                  "D2Payload"
              )

              if isinstance(
                  d2payload,
                  dict,
              ):

                  situations = d2payload.get(
                      "situation",
                      [],
                  )

                  if isinstance(
                      situations,
                      list,
                  ):

                      for situation in situations:

                          if not isinstance(
                              situation,
                              dict,
                          ):
                              continue

                          situation_records = (
                              situation.get(
                                  "situationRecord",
                                  [],
                              )
                          )

                          if isinstance(
                              situation_records,
                              list,
                          ):

                              records.extend(
                                  situation_records
                              )

          # --------------------------------------------------
          # RECORD COUNTS
          # --------------------------------------------------

          print("=" * 70)
          print("DATEX II RECORD COUNTS")
          print("=" * 70)
          print()

          print(
              f"Situation records identified: "
              f"{len(records)}"
          )

          print()

          # --------------------------------------------------
          # SITUATION COUNT
          # --------------------------------------------------

          situation_count = 0

          if isinstance(payload, dict):

              d2payload = payload.get(
                  "D2Payload"
              )

              if isinstance(
                  d2payload,
                  dict,
              ):

                  situations = d2payload.get(
                      "situation",
                      []
                  )

                  if isinstance(
                      situations,
                      list,
                  ):

                      situation_count = len(
                          situations
                      )

          print(
              f"Situations identified: "
              f"{situation_count}"
          )

          print()

          # --------------------------------------------------
          # LOOK FOR PAGINATION INFORMATION
          # --------------------------------------------------

          print("=" * 70)
          print("PAGINATION ANALYSIS")
          print("=" * 70)
          print()

          print(
              "x-next response header:"
          )

          if x_next:

              print(
                  "PRESENT"
              )

              print()
              print(
                  "The API supplied a continuation "
                  "URL for another page."
              )

              print()
              print(
                  "The continuation URL WILL NOT "
                  "be followed by this test."
              )

          else:

              print(
                  "NOT PRESENT"
              )

              print()
              print(
                  "No continuation URL was supplied "
                  "in the response headers."
              )

          print()

          # --------------------------------------------------
          # CHECK WHETHER 500 RECORDS WERE RETURNED
          # --------------------------------------------------

          print("=" * 70)
          print("500-RECORD LIMIT ANALYSIS")
          print("=" * 70)
          print()

          if len(records) == 500:

              print(
                  "EXACTLY 500 situation records "
                  "were returned."
              )

              print()

              if x_next:

                  print(
                      "RESULT: STRONG EVIDENCE that "
                      "500 is the first-page result "
                      "size and x-next provides the "
                      "next page."
                  )

              else:

                  print(
                      "RESULT: 500 records were "
                      "returned, but no x-next "
                      "header was supplied."
                  )

                  print(
                      "Pagination cannot be confirmed "
                      "from this response alone."
                  )

          elif len(records) < 500:

              print(
                  f"Only {len(records)} situation "
                  "records were returned."
              )

              if x_next:

                  print(
                      "An x-next header is present "
                      "despite fewer than 500 records."
                  )

              else:

                  print(
                      "No x-next header is present."
                  )

          else:

              print(
                  f"{len(records)} situation records "
                  "were returned."
              )

              print(
                  "The observed response exceeds "
                  "the previously observed 500-record "
                  "boundary."
              )

          print()

          # --------------------------------------------------
          # LOOK FOR PAGINATION METADATA INSIDE JSON
          # --------------------------------------------------

          print("=" * 70)
          print("JSON PAGINATION METADATA SEARCH")
          print("=" * 70)
          print()

          pagination_keywords = (
              "next",
              "nextLink",
              "continuation",
              "continuationToken",
              "page",
              "pageCursor",
              "cursor",
              "total",
              "count",
              "limit",
              "offset",
          )

          found_metadata = []

          def inspect_object(
              obj,
              path="",
          ):

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      key_lower = str(
                          key
                      ).lower()

                      if any(
                          keyword.lower()
                          in key_lower
                          for keyword
                          in pagination_keywords
                      ):

                          found_metadata.append(
                              (
                                  f"{path}.{key}",
                                  value,
                              )
                          )

                      inspect_object(
                          value,
                          f"{path}.{key}",
                      )

              elif isinstance(obj, list):

                  for index, value in enumerate(
                      obj
                  ):

                      inspect_object(
                          value,
                          f"{path}[{index}]",
                      )

          inspect_object(payload)

          if found_metadata:

              for path, value in found_metadata[:50]:

                  print(
                      f"{path}: "
                      f"{repr(value)[:500]}"
                  )

          else:

              print(
                  "No pagination-related fields "
                  "were identified inside the JSON."
              )

          print()

          # --------------------------------------------------
          # FINAL RESULT
          # --------------------------------------------------

          print("=" * 70)
          print("TEST 5 RESULT")
          print("=" * 70)
          print()

          if x_next:

              print(
                  "RESULT: PAGINATION CONFIRMED."
              )

              print()
              print(
                  "The live API returned an x-next "
                  "continuation URL."
              )

              print(
                  "The URL was NOT followed."
              )

              print(
                  "The next page must be retrieved "
                  "using the supplied x-next URL."
              )

          else:

              print(
                  "RESULT: PAGINATION NOT CONFIRMED "
                  "FROM THIS REQUEST."
              )

              print()
              print(
                  "No x-next response header was found."
              )

          print()
          print(
              "Exactly one API request was made."
          )
          print(
              "No retries were performed."
          )
          print(
              "No request splitting was performed."
          )
          print(
              "No pageCursor was supplied."
          )
          print(
              "No x-next URL was followed."
          )
          print(
              "closureType was NOT supplied."
          )
          print(
              "Production workflow was not modified."
          )
          print()
          print("TEST COMPLETE.")
          PY
      
