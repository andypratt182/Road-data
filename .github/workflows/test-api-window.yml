name: Test National Highways API Window Limits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compare 7-day and two 3.5-day windows
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timedelta, timezone

          from fetch_closures import fetch_closures

          UTC = timezone.utc

          now = datetime.now(UTC).replace(microsecond=0)

          seven_days = now + timedelta(days=7)

          midpoint = now + timedelta(
              days=3,
              hours=12,
          )

          def api_datetime(dt):
              """
              National Highways requires:
              YYYY-MM-DDThh:mm:ss

              Do NOT include the Z suffix.
              """
              return dt.strftime(
                  "%Y-%m-%dT%H:%M:%S"
              )

          def fingerprint(record):
              return json.dumps(
                  record,
                  sort_keys=True,
                  ensure_ascii=False,
              )

          windows = {
              "7-day": (
                  now,
                  seven_days,
              ),
              "first-3.5-day": (
                  now,
                  midpoint,
              ),
              "second-3.5-day": (
                  midpoint,
                  seven_days,
              ),
          }

          results = {}

          print("=" * 80)
          print(
              "NATIONAL HIGHWAYS API "
              "500-RECORD WINDOW TEST"
          )
          print("=" * 80)

          print()
          print(
              f"Test start: "
              f"{api_datetime(now)}"
          )

          print(
              f"Test end:   "
              f"{api_datetime(seven_days)}"
          )

          print()
          print(
              "Each request is separated by "
              "12 seconds."
          )

          print()

          for closure_type in (
              "planned",
              "unplanned",
          ):

              print()
              print("=" * 80)
              print(
                  f"CLOSURE TYPE: "
                  f"{closure_type.upper()}"
              )
              print("=" * 80)

              for name, (
                  start,
                  end,
              ) in windows.items():

                  print()
                  print("-" * 80)
                  print(name)
                  print("-" * 80)

                  start_string = api_datetime(
                      start
                  )

                  end_string = api_datetime(
                      end
                  )

                  print(
                      f"Start: {start_string}"
                  )

                  print(
                      f"End:   {end_string}"
                  )

                  print()
                  print(
                      "Requesting API..."
                  )

                  try:

                      records = fetch_closures(
                          closure_type=closure_type,
                          start_datetime=start_string,
                          end_datetime=end_string,
                      )

                      results[
                          (
                              closure_type,
                              name,
                          )
                      ] = records

                      print()
                      print(
                          f"Records returned: "
                          f"{len(records)}"
                      )

                  except Exception as exc:

                      print()
                      print(
                          "REQUEST FAILED:"
                      )

                      print(
                          repr(exc)
                      )

                      raise

                  print()
                  print(
                      "Waiting 12 seconds "
                      "before next request..."
                  )

                  time.sleep(12)

              full = results[
                  (
                      closure_type,
                      "7-day",
                  )
              ]

              first = results[
                  (
                      closure_type,
                      "first-3.5-day",
                  )
              ]

              second = results[
                  (
                      closure_type,
                      "second-3.5-day",
                  )
              ]

              full_set = {
                  fingerprint(record)
                  for record in full
              }

              first_set = {
                  fingerprint(record)
                  for record in first
              }

              second_set = {
                  fingerprint(record)
                  for record in second
              }

              split_union = (
                  first_set
                  | second_set
              )

              overlap = (
                  first_set
                  & second_set
              )

              only_in_full = (
                  full_set
                  - split_union
              )

              only_in_split = (
                  split_union
                  - full_set
              )

              print()
              print()
              print("=" * 80)
              print(
                  f"COMPARISON: "
                  f"{closure_type.upper()}"
              )
              print("=" * 80)

              print()
              print(
                  f"7-day result:           "
                  f"{len(full_set)}"
              )

              print(
                  f"First 3.5-day result:   "
                  f"{len(first_set)}"
              )

              print(
                  f"Second 3.5-day result:  "
                  f"{len(second_set)}"
              )

              print(
                  f"Split union:             "
                  f"{len(split_union)}"
              )

              print(
                  f"Split overlap:           "
                  f"{len(overlap)}"
              )

              print(
                  f"Split total:             "
                  f"{len(first_set) + len(second_set)}"
              )

              print(
                  f"Only in 7-day request:   "
                  f"{len(only_in_full)}"
              )

              print(
                  f"Only in split requests:  "
                  f"{len(only_in_split)}"
              )

              print()

              if (
                  len(full_set) == 500
                  and len(split_union) > 500
              ):

                  print(
                      "RESULT: STRONG EVIDENCE "
                      "OF A 500-RECORD CAP."
                  )

                  print(
                      "The 7-day request returned "
                      "exactly 500 records, while "
                      "the split requests returned "
                      "more than 500 unique records "
                      "combined."
                  )

              elif (
                  len(full_set) < 500
              ):

                  print(
                      "RESULT: The 7-day request "
                      "did not reach 500 records."
                  )

                  print(
                      "No 500-record cap was "
                      "demonstrated for this "
                      "closure type."
                  )

              elif (
                  len(full_set)
                  == len(split_union)
                  and full_set
                  == split_union
              ):

                  print(
                      "RESULT: The 7-day request "
                      "returned the same records "
                      "as the two split requests."
                  )

                  print(
                      "No evidence of records being "
                      "lost because of the 500-record "
                      "limit."
                  )

              else:

                  print(
                      "RESULT: DIFFERENCE DETECTED."
                  )

                  print(
                      "The 7-day request and split "
                      "requests returned different "
                      "record sets."
                  )

          print()
          print()
          print("=" * 80)
          print("TEST COMPLETE")
          print("=" * 80)

          print()
          print(
              "Production workflow was not modified."
          )

          print(
              "This workflow only runs manually."
          )
          PY
