name: Step 4 - Record Identity Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step4-record-identity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Road-data repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run Step 4 record identity test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          set -o pipefail

          python tests/step4_record_identity.py 2>&1 | tee auditlog.txt

      - name: Upload Step 4 audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-record-identity-audit
          path: auditlog.txt
          if-no-files-found: warn
