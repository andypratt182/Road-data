name: Test National Highways Paginator

on:
  workflow_dispatch:
    inputs:
      start_datetime:
        description: "Start datetime (ISO 8601 UTC)"
        required: true
        default: "2026-08-11T00:00:00Z"

      end_datetime:
        description: "End datetime (ISO 8601 UTC)"
        required: true
        default: "2026-08-18T23:59:59Z"

jobs:
  validate-paginator:
    name: Validate current National Highways collector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Validate current collector
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
          TEST_START: ${{ inputs.start_datetime }}
          TEST_END: ${{ inputs.end_datetime }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter

          from config import API_BASE_URL
          from sources.national_highways import (
              fetch_national_highways,
          )

          start = os.environ["TEST_START"]
          end = os.environ["TEST_END"]

          print("=" * 72)
          print("NATIONAL HIGHWAYS PAGINATION VALIDATION")
          print("=" * 72)

          print(f"API base URL: {API_BASE_URL}")
          print(f"Window start: {start}")
          print(f"Window end:   {end}")
          print("closureType:  NOT supplied")
          print("Collector:    sources/national_highways.py")
          print("Database:     NOT touched")
          print("Production workflow: NOT touched")
          print("=" * 72)
          print()

          try:
              records = fetch_national_highways(
                  start_datetime=start,
                  end_datetime=end,
              )
          except Exception as exc:
              print()
              print("=" * 72)
              print("VALIDATION FAILED")
              print("=" * 72)
              print(f"{type(exc).__name__}: {exc}")
              raise

          print()
          print("=" * 72)
          print("FINAL COLLECTOR OUTPUT")
          print("=" * 72)

          print(f"Returned records: {len(records)}")

          roads = Counter(
              str(record.get("road") or "")
              .strip()
              .upper()
              for record in records
          )

          print()
          print("Records by target road:")

          for road in ("M6", "M57", "M58", "M62"):
              print(
                  f"  {road}: {roads.get(road, 0)}"
              )

          print()
          print("Output field coverage:")

          total = len(records)

          fields = (
              "id",
              "road",
              "start",
              "end",
              "description",
          )

          for field in fields:
              present = sum(
                  1
                  for record in records
                  if record.get(field)
              )

              print(
                  f"  {field}: "
                  f"{present}/{total}"
              )

          ids = [
              record.get("id")
              for record in records
              if record.get("id")
          ]

          duplicate_ids = (
              len(ids) - len(set(ids))
          )

          print()
          print(
              f"Duplicate IDs: {duplicate_ids}"
          )

          starts = [
              str(record.get("start"))
              for record in records
              if record.get("start")
          ]

          ends = [
              str(record.get("end"))
              for record in records
              if record.get("end")
          ]

          if starts:
              print(
                  f"Earliest start: {min(starts)}"
              )

          if ends:
              print(
                  f"Latest end:   {max(ends)}"
              )

          print()
          print("=" * 72)
          print("VALIDATION PASSED")
          print("=" * 72)
          PY
