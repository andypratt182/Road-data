name: Test National Highways Paginator

on:
  workflow_dispatch:
    inputs:
      start_datetime:
        description: "Start datetime (ISO 8601 UTC)"
        required: true
        default: "2026-08-11T00:00:00Z"
      end_datetime:
        description: "End datetime (ISO 8601 UTC)"
        required: true
        default: "2026-08-18T23:59:59Z"

jobs:
  test-national-highways-paginator:
    name: Validate x-next pagination
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run paginator validation
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
          NATIONAL_HIGHWAYS_API_BASE_URL: ${{ vars.NATIONAL_HIGHWAYS_API_BASE_URL }}
          TEST_START: ${{ inputs.start_datetime }}
          TEST_END: ${{ inputs.end_datetime }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter

          from sources.national_highways import fetch_national_highways

          start = os.environ["TEST_START"]
          end = os.environ["TEST_END"]

          print("=" * 72)
          print("NATIONAL HIGHWAYS PAGINATION VALIDATION")
          print("=" * 72)
          print(f"Window start: {start}")
          print(f"Window end:   {end}")
          print("closureType:  NOT supplied by collector")
          print("pagination:   x-next handled by current collector")
          print("production importer/database: NOT touched")
          print("=" * 72)
          print()

          try:
              closures = fetch_national_highways(
                  start_datetime=start,
                  end_datetime=end,
              )
          except Exception as exc:
              print()
              print("=" * 72)
              print("VALIDATION FAILED")
              print("=" * 72)
              print(f"{type(exc).__name__}: {exc}")
              raise

          print()
          print("=" * 72)
          print("COMPACT RESULT SUMMARY")
          print("=" * 72)

          print(f"Final returned records: {len(closures)}")

          roads = Counter(
              str(record.get("road") or "").strip().upper()
              for record in closures
          )

          print("Records by road:")
          for road in ("M6", "M57", "M58", "M62"):
              print(f"  {road}: {roads.get(road, 0)}")

          total = len(closures)

          with_start = sum(
              bool(record.get("start"))
              for record in closures
          )

          with_end = sum(
              bool(record.get("end"))
              for record in closures
          )

          with_id = sum(
              bool(record.get("id"))
              for record in closures
          )

          with_description = sum(
              bool(record.get("description"))
              for record in closures
          )

          print("Output field coverage:")
          print(f"  id:          {with_id}/{total}")
          print(f"  start:       {with_start}/{total}")
          print(f"  end:         {with_end}/{total}")
          print(f"  description: {with_description}/{total}")

          starts = [
              str(record.get("start"))
              for record in closures
              if record.get("start")
          ]

          ends = [
              str(record.get("end"))
              for record in closures
              if record.get("end")
          ]

          if starts:
              print(f"Earliest start: {min(starts)}")

          if ends:
              print(f"Latest end:     {max(ends)}")

          ids = [
              record.get("id")
              for record in closures
              if record.get("id")
          ]

          duplicate_ids = len(ids) - len(set(ids))

          print(f"Duplicate output IDs: {duplicate_ids}")

          print("=" * 72)
          print("VALIDATION PASSED")
          print("=" * 72)
          PY
