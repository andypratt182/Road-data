name: Update Road Data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-road-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch road data
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          from fetch_closures import fetch_closures

          planned = fetch_closures(closure_type="planned")
          unplanned = fetch_closures(closure_type="unplanned")

          closures = planned + unplanned

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "closures": closures,
          }

          with open("data/road_data.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  indent=2,
                  ensure_ascii=False,
              )

          print(f"Written {len(closures)} closures")
          print(f"Updated: {output['updated']}")
          PY

      - name: Generate website
        run: python build_site.py
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated road data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/road_data.json site/index.html

          if git diff --cached --quiet; then
            echo "No changes to road data or website"
          else
            git commit -m "Update road closure data"
            git push
          fi
