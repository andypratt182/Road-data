name: Audit Road Closure Types

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-road-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit "other" closure records
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          with open("data/road_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          closures = data.get("closures", [])

          other_records = [
              closure
              for closure in closures
              if str(closure.get("type") or "").strip().lower() == "other"
          ]

          print("=" * 80)
          print("NATIONAL HIGHWAYS - 'OTHER' CLOSURE AUDIT")
          print("=" * 80)
          print(f"Total closures: {len(closures)}")
          print(f"'other' closures: {len(other_records)}")
          print("=" * 80)
          print()

          # --------------------------------------------------
          # ROAD SUMMARY
          # --------------------------------------------------

          roads = Counter(
              str(c.get("road") or "MISSING")
              for c in other_records
          )

          print("=" * 80)
          print("BY ROAD")
          print("=" * 80)

          for road, count in roads.most_common():
              print(f"{road}: {count}")

          print()

          # --------------------------------------------------
          # DIRECTION SUMMARY
          # --------------------------------------------------

          directions = Counter(
              str(c.get("direction") or "MISSING")
              for c in other_records
          )

          print("=" * 80)
          print("BY DIRECTION")
          print("=" * 80)

          for direction, count in directions.most_common():
              print(f"{direction}: {count}")

          print()

          # --------------------------------------------------
          # CAUSE SUMMARY
          # --------------------------------------------------

          causes = Counter(
              str(c.get("cause") or "MISSING")
              for c in other_records
          )

          print("=" * 80)
          print("BY CAUSE")
          print("=" * 80)

          for cause, count in causes.most_common():
              print(f"{cause}: {count}")

          print()

          # --------------------------------------------------
          # DESCRIPTION SUMMARY
          # --------------------------------------------------

          descriptions = Counter(
              str(c.get("description") or "MISSING").strip()
              for c in other_records
          )

          print("=" * 80)
          print("DESCRIPTION FREQUENCY")
          print("=" * 80)

          for description, count in descriptions.most_common():
              print(f"[{count}] {description}")

          print()

          # --------------------------------------------------
          # INDIVIDUAL RECORDS
          # --------------------------------------------------

          print("=" * 80)
          print("INDIVIDUAL 'OTHER' RECORDS")
          print("=" * 80)

          for number, closure in enumerate(other_records, start=1):

              print()
              print("-" * 80)
              print(f"RECORD {number}")
              print("-" * 80)

              print(
                  f"Road:        {closure.get('road') or 'MISSING'}"
              )

              print(
                  f"Direction:   {closure.get('direction') or 'MISSING'}"
              )

              print(
                  f"Status:      {closure.get('status') or 'MISSING'}"
              )

              print(
                  f"Cause:       {closure.get('cause') or 'MISSING'}"
              )

              print(
                  f"Start:       {closure.get('start') or 'MISSING'}"
              )

              print(
                  f"End:         {closure.get('end') or 'MISSING'}"
              )

              print(
                  f"Description: {closure.get('description') or 'MISSING'}"
              )

          print()
          print("=" * 80)
          print("AUDIT COMPLETE")
          print("=" * 80)
          print(f"Total 'other' records audited: {len(other_records)}")
          print("=" * 80)
          PY
