name: Test Parser

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run parser comparison test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import inspect
          import sys
          import data_processor

          print("=" * 80)
          print("PARSER TEST - COMPACT OUTPUT")
          print("=" * 80)

          print("data_processor.py imported successfully.")

          # ------------------------------------------------------------
          # Inspect the actual functions currently present.
          # ------------------------------------------------------------

          functions = [
              name for name, obj in vars(data_processor).items()
              if inspect.isfunction(obj)
          ]

          print("Available functions:")
          for name in sorted(functions):
              print(f"  {name}")

          # ------------------------------------------------------------
          # Find the parser's existing processing function.
          # We deliberately do NOT modify the production importer.
          # ------------------------------------------------------------

          parser = None

          for name in (
              "process_data",
              "process_payload",
              "process_records",
              "parse_d2_payload",
          ):
              candidate = getattr(data_processor, name, None)
              if callable(candidate):
                  parser = candidate
                  print(f"Parser function selected: {name}()")
                  break

          if parser is None:
              print("ERROR: No suitable parser function found.")
              sys.exit(1)

          # ------------------------------------------------------------
          # Determine the function signature.
          # ------------------------------------------------------------

          try:
              signature = inspect.signature(parser)
              print(f"Parser signature: {signature}")
          except Exception as exc:
              print(f"Could not inspect parser signature: {exc}")

          # ------------------------------------------------------------
          # Locate the existing API/data-loading function if present.
          # This is deliberately based on the current data_processor.py.
          # ------------------------------------------------------------

          loader_names = (
              "fetch_data",
              "load_data",
              "get_data",
              "download_data",
              "fetch_api_data",
              "get_api_data",
              "fetch_national_highways_data",
              "get_national_highways_data",
          )

          loader = None

          for name in loader_names:
              candidate = getattr(data_processor, name, None)
              if callable(candidate):
                  loader = candidate
                  print(f"API/data loader found: {name}()")
                  break

          if loader is None:
              print("ERROR: No known API/data-loading function found.")
              print("The parser test cannot safely invent an API call.")
              sys.exit(1)

          # ------------------------------------------------------------
          # Call the existing loader.
          # ------------------------------------------------------------

          print()
          print("Calling existing API/data loader...")
          print()

          try:
              raw_data = loader()
          except TypeError:
              # Some implementations require the API key explicitly.
              try:
                  raw_data = loader(
                      api_key=__import__("os").environ[
                          "NATIONAL_HIGHWAYS_API_KEY"
                      ]
                  )
              except Exception as exc:
                  print(f"ERROR: API/data loader failed: {exc}")
                  sys.exit(1)
          except Exception as exc:
              print(f"ERROR: API/data loader failed: {exc}")
              sys.exit(1)

          print("API/data loader completed successfully.")
          print(f"Raw return type: {type(raw_data).__name__}")

          # ------------------------------------------------------------
          # Run the existing parser.
          # ------------------------------------------------------------

          print()
          print("Running parser...")
          print()

          try:
              result = parser(raw_data)
          except TypeError:
              # Some parser functions may expect the extracted records
              # rather than the complete payload.
              extract = getattr(data_processor, "extract_raw_records", None)

              if not callable(extract):
                  raise

              print("Parser rejected complete payload.")
              print("Trying parser with extract_raw_records() output...")

              records = extract(raw_data)
              result = parser(records)

          except Exception as exc:
              print()
              print("ERROR: PARSER CRASHED")
              print(f"{type(exc).__name__}: {exc}")
              raise

          # ------------------------------------------------------------
          # Normalise the parser return into a list where possible.
          # ------------------------------------------------------------

          if result is None:
              parsed_records = []
          elif isinstance(result, list):
              parsed_records = result
          elif isinstance(result, tuple):
              parsed_records = list(result)
          elif isinstance(result, dict):
              # Common possibilities:
              # {"records": [...]}
              # {"data": [...]}
              # {"results": [...]}
              parsed_records = None

              for key in ("records", "data", "results", "fixtures"):
                  value = result.get(key)
                  if isinstance(value, list):
                      parsed_records = value
                      break

              if parsed_records is None:
                  parsed_records = [result]
          else:
              parsed_records = [result]

          print(f"Parser return type: {type(result).__name__}")
          print(f"Parsed records: {len(parsed_records)}")

          # ------------------------------------------------------------
          # Compact record inspection.
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("COMPACT PARSED RECORDS")
          print("=" * 80)

          if not parsed_records:
              print("WARNING: Parser returned zero records.")

          expected_fields = [
              "id",
              "record_id",
              "idG",
              "road",
              "road_name",
              "roadName",
              "direction",
              "start",
              "start_datetime",
              "end",
              "end_datetime",
              "comment",
              "location",
              "location_description",
          ]

          field_counts = {field: 0 for field in expected_fields}

          for index, record in enumerate(parsed_records, start=1):

              if not isinstance(record, dict):
                  print(
                      f"RECORD {index}: "
                      f"type={type(record).__name__}"
                  )
                  continue

              def first_value(*names):
                  for name in names:
                      value = record.get(name)
                      if value not in (None, ""):
                          return value
                  return ""

              record_id = first_value(
                  "id",
                  "record_id",
                  "idG",
              )

              road = first_value(
                  "road",
                  "road_name",
                  "roadName",
              )

              direction = first_value(
                  "direction",
              )

              start = first_value(
                  "start",
                  "start_datetime",
              )

              end = first_value(
                  "end",
                  "end_datetime",
              )

              comment = first_value(
                  "comment",
                  "location_description",
                  "location",
              )

              print(
                  f"RECORD {index}: "
                  f"id={record_id} | "
                  f"road={road} | "
                  f"direction={direction} | "
                  f"start={start} | "
                  f"end={end} | "
                  f"comment={str(comment)[:100]}"
              )

              for field in expected_fields:
                  if record.get(field) not in (None, ""):
                      field_counts[field] += 1

          # ------------------------------------------------------------
          # Missing-field report.
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("MISSING-FIELD REPORT")
          print("=" * 80)

          total_records = len(parsed_records)

          if total_records:
              for field in expected_fields:
                  present = field_counts[field]
                  missing = total_records - present

                  if missing:
                      print(
                          f"{field}: "
                          f"present={present}, "
                          f"missing={missing}"
                      )
          else:
              print("No parsed records available for field analysis.")

          # ------------------------------------------------------------
          # Useful combined checks.
          # ------------------------------------------------------------

          valid_id = sum(
              bool(
                  record.get("id")
                  or record.get("record_id")
                  or record.get("idG")
              )
              for record in parsed_records
              if isinstance(record, dict)
          )

          valid_road = sum(
              bool(
                  record.get("road")
                  or record.get("road_name")
                  or record.get("roadName")
              )
              for record in parsed_records
              if isinstance(record, dict)
          )

          valid_start_end = sum(
              bool(
                  record.get("start")
                  or record.get("start_datetime")
              )
              and bool(
                  record.get("end")
                  or record.get("end_datetime")
              )
              for record in parsed_records
              if isinstance(record, dict)
          )

          valid_direction = sum(
              bool(record.get("direction"))
              for record in parsed_records
              if isinstance(record, dict)
          )

          # ------------------------------------------------------------
          # Final totals.
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("FINAL TOTALS")
          print("=" * 80)

          print(f"Parsed records: {total_records}")
          print(f"Records with ID: {valid_id}")
          print(f"Records with road: {valid_road}")
          print(f"Records with direction: {valid_direction}")
          print(f"Records with valid start/end: {valid_start_end}")

          print()
          print("=" * 80)
          print("PARSER TEST COMPLETE")
          print("=" * 80)

          print("Production importer was not modified.")
          print("Database was not modified.")
          print("This workflow produced diagnostic output only.")

          # ------------------------------------------------------------
          # Only fail because the parser produced no records if the
          # API returned data. This keeps the test useful without
          # imposing assumptions about every individual field.
          # ------------------------------------------------------------

          if raw_data and not parsed_records:
              print()
              print("ERROR: API returned data but parser returned zero records.")
              sys.exit(1)

          print()
          print("TEST PASSED")
          PY
