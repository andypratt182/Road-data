name: Test Parser

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run parser comparison test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          import data_processor

          print("=" * 80)
          print("PARSER COMPARISON TEST")
          print("=" * 80)

          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"

          API_KEY = os.environ.get("NATIONAL_HIGHWAYS_API_KEY")

          if not API_KEY:
              print("ERROR: NATIONAL_HIGHWAYS_API_KEY is not available.")
              sys.exit(1)

          params = {
              "startDateTime": START,
              "endDateTime": END,
          }

          # These are the headers used by the successful
          # controlled National Highways API test.
          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          print(f"Start: {START}")
          print(f"End:   {END}")
          print("closureType: NOT supplied")
          print("Pagination: NOT followed")
          print("Requests: 1")
          print()

          # ============================================================
          # ONE API REQUEST
          # ============================================================

          try:
              response = requests.get(
                  API_URL,
                  params=params,
                  headers=headers,
                  timeout=60,
              )
          except Exception as exc:
              print(f"ERROR: API request failed: {exc}")
              sys.exit(1)

          print(f"HTTP status: {response.status_code}")
          print(f"Response characters: {len(response.text)}")
          print(f"Content-Type: {response.headers.get('Content-Type', '')}")

          if response.status_code == 429:
              print()
              print("ERROR: RATE LIMIT RECEIVED.")
              print(
                  "Retry-After:",
                  response.headers.get("Retry-After", "not supplied"),
              )
              sys.exit(1)

          if response.status_code != 200:
              print()
              print("ERROR: API request did not return HTTP 200.")
              print(response.text[:2000])
              sys.exit(1)

          # ============================================================
          # JSON DECODE
          # ============================================================

          try:
              payload = response.json()
          except Exception as exc:
              print()
              print("=" * 80)
              print("ERROR: API RESPONSE IS NOT VALID JSON")
              print("=" * 80)
              print(f"{type(exc).__name__}: {exc}")
              print()
              print("Content-Type:")
              print(response.headers.get("Content-Type", ""))
              print()
              print("First 1000 response characters:")
              print(repr(response.text[:1000]))
              print()
              print("This normally indicates the API media/format")
              print("headers were not honoured by the endpoint.")
              sys.exit(1)

          print("Raw JSON decoded successfully.")
          print(f"Top-level payload type: {type(payload).__name__}")

          if not isinstance(payload, dict):
              print("ERROR: Expected a JSON object.")
              sys.exit(1)

          # ============================================================
          # RAW D2 RECORD EXTRACTION
          # ============================================================

          try:
              raw_records = data_processor.extract_raw_records(payload)
          except Exception as exc:
              print()
              print("ERROR: extract_raw_records() failed.")
              print(f"{type(exc).__name__}: {exc}")
              sys.exit(1)

          print(f"Raw D2 situation records: {len(raw_records)}")

          if not raw_records:
              print()
              print("ERROR: No D2 situation records were found.")
              print()
              print("Top-level keys:")
              print(list(payload.keys()))
              sys.exit(1)

          # ============================================================
          # PRODUCTION PARSER
          # ============================================================

          print()
          print("Calling data_processor.process_data(payload)...")

          try:
              parsed_records = data_processor.process_data(payload)
          except Exception as exc:
              print()
              print("=" * 80)
              print("PARSER CRASHED")
              print("=" * 80)
              print(f"{type(exc).__name__}: {exc}")
              raise

          if parsed_records is None:
              parsed_records = []

          if not isinstance(parsed_records, list):
              print(
                  "ERROR: process_data() returned "
                  f"{type(parsed_records).__name__}, expected list."
              )
              sys.exit(1)

          print(f"Parsed records returned: {len(parsed_records)}")

          # ============================================================
          # COMPACT RECORD OUTPUT
          # ============================================================

          print()
          print("=" * 80)
          print("COMPACT PARSED RECORDS")
          print("=" * 80)

          for index, record in enumerate(parsed_records, start=1):

              if not isinstance(record, dict):
                  print(
                      f"RECORD {index}: INVALID "
                      f"TYPE={type(record).__name__}"
                  )
                  continue

              record_id = record.get("idG", "")
              road = record.get("road_name", "")
              direction = record.get("direction", "")
              management = record.get("management_type", "")
              validity = record.get("validity_status", "")
              start = record.get("start", "")
              end = record.get("end", "")
              comment = record.get("comment", "")

              locations = record.get("locations", [])

              print(
                  f"RECORD {index}: "
                  f"id={record_id} | "
                  f"road={road or '<MISSING>'} | "
                  f"direction={direction or '<MISSING>'} | "
                  f"type={management or '<MISSING>'} | "
                  f"status={validity or '<MISSING>'} | "
                  f"start={start or '<MISSING>'} | "
                  f"end={end or '<MISSING>'} | "
                  f"locations={len(locations)} | "
                  f"comment={str(comment)[:100]}"
              )

          # ============================================================
          # FIELD COMPLETENESS
          # ============================================================

          fields = [
              "idG",
              "versionG",
              "management_type",
              "validity_status",
              "start",
              "end",
              "probability",
              "compliance",
              "source",
              "cause_type",
              "comment",
              "road_name",
              "direction",
              "direction_relative",
              "linear_element_type",
              "from_distance",
              "to_distance",
              "location_description",
              "carriageway",
              "carriageway_extended",
              "lanes_restricted",
              "lanes_operational",
              "locations",
          ]

          print()
          print("=" * 80)
          print("MISSING-FIELD REPORT")
          print("=" * 80)

          if not parsed_records:
              print("No parsed records available.")

          else:
              for field in fields:
                  present = 0
                  missing = 0

                  for record in parsed_records:
                      if not isinstance(record, dict):
                          missing += 1
                          continue

                      value = record.get(field)

                      if value is None or value == "":
                          missing += 1
                      elif field == "locations" and not value:
                          missing += 1
                      else:
                          present += 1

                  print(
                      f"{field}: "
                      f"present={present}, "
                      f"missing={missing}"
                  )

          # ============================================================
          # SEMANTIC COUNTS
          # ============================================================

          records_with_id = 0
          records_with_road = 0
          records_with_direction = 0
          records_with_start_end = 0
          records_with_locations = 0

          for record in parsed_records:

              if not isinstance(record, dict):
                  continue

              if record.get("idG"):
                  records_with_id += 1

              if record.get("road_name"):
                  records_with_road += 1

              if record.get("direction"):
                  records_with_direction += 1

              if (
                  record.get("start_datetime") is not None
                  and record.get("end_datetime") is not None
              ):
                  records_with_start_end += 1

              if record.get("locations"):
                  records_with_locations += 1

          # ============================================================
          # FINAL TOTALS
          # ============================================================

          print()
          print("=" * 80)
          print("FINAL TOTALS")
          print("=" * 80)

          print(
              f"Raw API records:              {len(raw_records)}"
          )

          print(
              f"Parsed records:               {len(parsed_records)}"
          )

          print(
              f"Records with ID:              {records_with_id}"
          )

          print(
              f"Records with road:            {records_with_road}"
          )

          print(
              f"Records with direction:       {records_with_direction}"
          )

          print(
              f"Records with valid start/end: {records_with_start_end}"
          )

          print(
              f"Records with locations:       {records_with_locations}"
          )

          print()
          print("=" * 80)
          print("TEST CONDITIONS")
          print("=" * 80)

          print("Successful API request: YES")
          print("HTTP status: 200")
          print("closureType supplied: NO")
          print("Pagination followed: NO")
          print("Production importer modified: NO")
          print("Database modified: NO")

          print()
          print("=" * 80)
          print("PARSER COMPARISON COMPLETE")
          print("=" * 80)

          # ============================================================
          # FAILURE CONDITIONS
          # ============================================================

          if len(raw_records) > 0 and len(parsed_records) == 0:
              print()
              print(
                  "ERROR: API returned records but "
                  "the production parser returned zero records."
              )
              sys.exit(1)

          if len(parsed_records) != len(raw_records):
              print()
              print(
                  "WARNING: Raw and parsed record counts differ."
              )
              print(
                  f"Raw={len(raw_records)}, "
                  f"Parsed={len(parsed_records)}"
              )

          print()
          print("TEST PASSED")
          PY
