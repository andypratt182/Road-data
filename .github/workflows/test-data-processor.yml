name: Test Parser - Compact Raw D2 Records

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run parser test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          from collections import Counter
          from datetime import datetime

          import requests

          from data_processor import (
              extract_raw_records,
              parse_situation_record,
          )


          API_URL = (
              "https://api.data.nationalhighways.co.uk"
              "/roads/v2.0/closures"
          )

          API_KEY = os.environ["NATIONAL_HIGHWAYS_API_KEY"]

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"

          MAX_REQUESTS = 20

          headers = {
              "Ocp-Apim-Subscription-Key": API_KEY,
              "X-Response-MediaType": "application/json",
              "X-Data-Format": "DATEXII",
          }

          params = {
              "startDateTime": START,
              "endDateTime": END,
          }


          def request_with_rate_limit():
              request_count = 0

              while True:
                  request_count += 1

                  if request_count > MAX_REQUESTS:
                      raise RuntimeError(
                          f"Maximum request limit of "
                          f"{MAX_REQUESTS} reached."
                      )

                  response = requests.get(
                      API_URL,
                      params=params,
                      headers=headers,
                      timeout=60,
                  )

                  print(
                      f"API request {request_count}: "
                      f"HTTP {response.status_code}"
                  )

                  if response.status_code == 429:
                      retry_after = response.headers.get(
                          "Retry-After"
                      )

                      if not retry_after:
                          raise RuntimeError(
                              "HTTP 429 received without "
                              "Retry-After."
                          )

                      try:
                          wait_seconds = int(retry_after)
                      except ValueError as exc:
                          raise RuntimeError(
                              "Invalid Retry-After value: "
                              f"{retry_after}"
                          ) from exc

                      print(
                          f"Rate limited. Waiting "
                          f"{wait_seconds} seconds..."
                      )

                      time.sleep(max(0, wait_seconds))
                      continue

                  if response.status_code != 200:
                      print(response.text[:2000])

                      raise RuntimeError(
                          f"HTTP {response.status_code}"
                      )

                  return response


          print("=" * 80)
          print("PARSER TEST - COMPACT OUTPUT")
          print("=" * 80)
          print()
          print("Purpose:")
          print(
              "Run the current data_processor.py against the "
              "raw National Highways D2Payload."
          )
          print()
          print("closureType: NOT supplied")
          print("Pagination: NOT followed")
          print(f"Start: {START}")
          print(f"End:   {END}")
          print()
          print("Production importer: NOT modified")
          print("Database: NOT modified")
          print()

          # ------------------------------------------------------------
          # Import verification
          # ------------------------------------------------------------

          print("Parser functions imported successfully:")
          print("  extract_raw_records()")
          print("  parse_situation_record()")
          print()

          # ------------------------------------------------------------
          # API request
          # ------------------------------------------------------------

          response = request_with_rate_limit()

          try:
              payload = response.json()
          except Exception as exc:
              raise RuntimeError(
                  "API response was not valid JSON."
              ) from exc

          if not isinstance(payload, dict):
              raise RuntimeError(
                  "API response top level is not a dictionary."
              )

          # ------------------------------------------------------------
          # Raw record extraction
          # ------------------------------------------------------------

          raw_records = extract_raw_records(payload)

          if not isinstance(raw_records, list):
              raise RuntimeError(
                  "extract_raw_records() did not return a list."
              )

          print()
          print(
              f"Raw D2 situation records found: "
              f"{len(raw_records)}"
          )
          print()

          # ------------------------------------------------------------
          # Parse each record
          # ------------------------------------------------------------

          parsed_records = []
          parser_failures = []

          missing = Counter()

          for index, raw_record in enumerate(
              raw_records,
              start=1,
          ):

              try:
                  parsed = parse_situation_record(
                      raw_record
                  )

              except Exception as exc:
                  parser_failures.append(
                      {
                          "index": index,
                          "error": (
                              f"{type(exc).__name__}: "
                              f"{exc}"
                          ),
                      }
                  )

                  print(
                      f"RECORD {index:03d} | "
                      f"PARSER ERROR | "
                      f"{type(exc).__name__}: {exc}"
                  )

                  continue

              if parsed is None:
                  parser_failures.append(
                      {
                          "index": index,
                          "error": "Parser returned None",
                      }
                  )

                  print(
                      f"RECORD {index:03d} | "
                      f"PARSER RETURNED NONE"
                  )

                  continue

              parsed_records.append(parsed)

              # --------------------------------------------------------
              # Missing-field checks
              # --------------------------------------------------------

              fields_to_check = {
                  "id": parsed.get("id"),
                  "management_type": parsed.get(
                      "management_type"
                  ),
                  "validity_status": parsed.get(
                      "validity_status"
                  ),
                  "start": parsed.get("start"),
                  "end": parsed.get("end"),
                  "road_name": parsed.get("road_name"),
                  "direction": parsed.get("direction"),
                  "linear_element_type": parsed.get(
                      "linear_element_type"
                  ),
                  "location_description": parsed.get(
                      "location_description"
                  ),
                  "carriageway": parsed.get(
                      "carriageway"
                  ),
                  "comment": parsed.get("comment"),
                  "locations": parsed.get("locations"),
              }

              for field_name, value in fields_to_check.items():

                  missing_value = (
                      value is None
                      or value == ""
                      or value == []
                  )

                  if missing_value:
                      missing[field_name] += 1

              # --------------------------------------------------------
              # Compact one-line record output
              # --------------------------------------------------------

              record_id = parsed.get("id") or "NO-ID"

              road = (
                  parsed.get("road_name")
                  or "MISSING"
              )

              direction = (
                  parsed.get("direction")
                  or "MISSING"
              )

              management = (
                  parsed.get("management_type")
                  or "MISSING"
              )

              validity = (
                  parsed.get("validity_status")
                  or "MISSING"
              )

              start = (
                  parsed.get("start")
                  or "MISSING"
              )

              end = (
                  parsed.get("end")
                  or "MISSING"
              )

              locations = parsed.get("locations") or []

              comment = (
                  parsed.get("comment")
                  or ""
              )

              # Keep the Actions log compact.
              if len(comment) > 100:
                  comment = comment[:97] + "..."

              print(
                  f"RECORD {index:03d} | "
                  f"road={road} | "
                  f"direction={direction} | "
                  f"type={management} | "
                  f"status={validity} | "
                  f"locations={len(locations)} | "
                  f"start={start} | "
                  f"end={end} | "
                  f"comment={comment}"
              )

          # ------------------------------------------------------------
          # Missing-field report
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("MISSING-FIELD REPORT")
          print("=" * 80)

          if not missing:
              print("No missing fields detected.")
          else:
              total_records = len(raw_records)

              for field_name in sorted(missing):
                  count = missing[field_name]

                  print(
                      f"{field_name}: "
                      f"{count}/{total_records} "
                      f"records missing"
                  )

          # ------------------------------------------------------------
          # Parser failures
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("PARSER FAILURE REPORT")
          print("=" * 80)

          if not parser_failures:
              print("No parser failures.")
          else:
              for failure in parser_failures:
                  print(
                      f"RECORD {failure['index']:03d}: "
                      f"{failure['error']}"
                  )

          # ------------------------------------------------------------
          # Final totals
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("FINAL TOTALS")
          print("=" * 80)

          print(
              f"Raw records discovered: "
              f"{len(raw_records)}"
          )

          print(
              f"Successfully parsed: "
              f"{len(parsed_records)}"
          )

          print(
              f"Parser failures: "
              f"{len(parser_failures)}"
          )

          print(
              f"Records with locations: "
              f"{sum(bool(r.get('locations')) for r in parsed_records)}"
          )

          print(
              f"Records with road_name: "
              f"{sum(bool(r.get('road_name')) for r in parsed_records)}"
          )

          print(
              f"Records with direction: "
              f"{sum(bool(r.get('direction')) for r in parsed_records)}"
          )

          print(
              f"Records with comments: "
              f"{sum(bool(r.get('comment')) for r in parsed_records)}"
          )

          print(
              f"Records with valid start/end: "
              f"{sum(bool(r.get('start_datetime')) and "
              f"bool(r.get('end_datetime')) "
              f"for r in parsed_records)}"
          )

          print()

          # ------------------------------------------------------------
          # Explicit test result
          # ------------------------------------------------------------

          if parser_failures:
              print(
                  "TEST RESULT: FAIL "
                  "(parser errors occurred)"
              )
              raise SystemExit(1)

          print(
              "TEST RESULT: PASS "
              "(parser completed without crashing)"
          )

          print("=" * 80)
          print("PRODUCTION IMPORTER: UNCHANGED")
          print("DATABASE: UNCHANGED")
          print("=" * 80)

          PY
