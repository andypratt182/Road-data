name: Test Parser Against Live API

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run parser test
        env:
          NH_API_KEY: ${{ secrets.NH_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          print("=" * 80)
          print("PARSER TEST - LIVE API -> EXISTING DATA PROCESSOR")
          print("=" * 80)

          # ------------------------------------------------------------------
          # Import the existing production parser.
          # ------------------------------------------------------------------

          import data_processor

          print("data_processor.py imported successfully.")

          required_functions = [
              "extract_raw_records",
              "parse_d2_payload",
              "parse_situation_record",
              "process_payload",
              "process_records",
              "process_data",
          ]

          print("\nExisting parser functions:")
          for name in required_functions:
              exists = hasattr(data_processor, name)
              print(f"  {name}: {'YES' if exists else 'NO'}")

          # ------------------------------------------------------------------
          # API request
          #
          # This deliberately lives in the test workflow.
          # We are NOT modifying the production parser to load the API.
          # ------------------------------------------------------------------

          url = "https://api.data.nationalhighways.co.uk/roads/v2.0/closures"

          params = {
              "startDateTime": "2026-08-11T00:00:00",
              "endDateTime": "2026-08-18T23:59:59",
          }

          headers = {
              "Accept": "application/json",
          }

          if not data_processor:
              raise RuntimeError("Unable to import data_processor.py")

          api_key = __import__("os").environ.get("NH_API_KEY")

          if not api_key:
              print("\nWARNING: NH_API_KEY is not available.")
              print("The request may fail with HTTP 401.")

          # The existing API authentication used by Test 5.
          if api_key:
              headers["Ocp-Apim-Subscription-Key"] = api_key

          print("\n" + "-" * 80)
          print("API REQUEST")
          print("-" * 80)
          print(f"URL: {url}")
          print(f"Start: {params['startDateTime']}")
          print(f"End:   {params['endDateTime']}")
          print("closureType: NOT supplied")
          print()

          response = requests.get(
              url,
              params=params,
              headers=headers,
              timeout=60,
          )

          print(f"HTTP STATUS: {response.status_code}")

          response.raise_for_status()

          payload = response.json()

          print("JSON response received successfully.")

          # ------------------------------------------------------------------
          # Basic payload inspection
          # ------------------------------------------------------------------

          print("\n" + "-" * 80)
          print("PAYLOAD STRUCTURE")
          print("-" * 80)

          if isinstance(payload, dict):
              print("Top-level type: dict")
              print("Top-level keys:")

              for key in payload.keys():
                  print(f"  {key}")
          else:
              print(f"Top-level type: {type(payload).__name__}")

          # ------------------------------------------------------------------
          # Find the raw records using the EXISTING parser helper.
          # ------------------------------------------------------------------

          print("\n" + "-" * 80)
          print("EXTRACT RAW RECORDS")
          print("-" * 80)

          extract_raw_records = getattr(
              data_processor,
              "extract_raw_records",
              None,
          )

          if not callable(extract_raw_records):
              raise RuntimeError(
                  "data_processor.extract_raw_records() was not found."
              )

          raw_records = extract_raw_records(payload)

          if raw_records is None:
              raw_records = []

          if not isinstance(raw_records, list):
              raw_records = list(raw_records)

          print(f"Raw records extracted: {len(raw_records)}")

          # ------------------------------------------------------------------
          # Test individual raw records against the existing parser.
          # ------------------------------------------------------------------

          parse_record = getattr(
              data_processor,
              "parse_situation_record",
              None,
          )

          if not callable(parse_record):
              raise RuntimeError(
                  "data_processor.parse_situation_record() was not found."
              )

          successful = 0
          failed = 0

          missing_counts = {}

          print("\n" + "=" * 80)
          print("COMPACT PARSER RESULTS")
          print("=" * 80)

          for index, raw_record in enumerate(raw_records, start=1):

              try:
                  parsed = parse_record(raw_record)

                  if parsed is None:
                      failed += 1
                      print(f"\nRECORD {index}: PARSE RETURNED NONE")
                      continue

                  successful += 1

                  # ----------------------------------------------------------
                  # Display useful parsed fields without dumping the record.
                  # ----------------------------------------------------------

                  def get_value(obj, *keys):
                      if not isinstance(obj, dict):
                          return None

                      for key in keys:
                          if key in obj:
                              return obj[key]

                      return None

                  road = get_value(
                      parsed,
                      "road",
                      "roadName",
                      "road_number",
                      "roadNumber",
                    )

                  direction = get_value(
                      parsed,
                      "direction",
                      "directionName",
                    )

                  start = get_value(
                      parsed,
                      "start",
                      "startTime",
                      "start_datetime",
                      "startDateTime",
                    )

                  end = get_value(
                      parsed,
                      "end",
                      "endTime",
                      "end_datetime",
                      "endDateTime",
                    )

                  description = get_value(
                      parsed,
                      "description",
                      "comment",
                      "locationDescription",
                      "location",
                    )

                  management = get_value(
                      parsed,
                      "management_type",
                      "managementType",
                      "type",
                    )

                  print(f"\nRECORD {index}: OK")
                  print(f"  road:        {road!r}")
                  print(f"  direction:   {direction!r}")
                  print(f"  start:       {start!r}")
                  print(f"  end:         {end!r}")
                  print(f"  type:        {management!r}")
                  print(f"  description: {description!r}")

                  # ----------------------------------------------------------
                  # Record missing useful values for the summary.
                  # ----------------------------------------------------------

                  fields = {
                      "road": road,
                      "direction": direction,
                      "start": start,
                      "end": end,
                      "description": description,
                      "managementType": management,
                  }

                  for field, value in fields.items():
                      if value in (None, "", []):
                          missing_counts[field] = (
                              missing_counts.get(field, 0) + 1
                          )

              except Exception as exc:
                  failed += 1

                  print(f"\nRECORD {index}: PARSE ERROR")
                  print(f"  {type(exc).__name__}: {exc}")

          # ------------------------------------------------------------------
          # Test the higher-level parser too, if available.
          #
          # We do this separately so we can see whether the individual
          # record parser works even if the aggregate processor behaves
          # differently.
          # ------------------------------------------------------------------

          print("\n" + "=" * 80)
          print("HIGH-LEVEL PARSER TEST")
          print("=" * 80)

          process_payload = getattr(
              data_processor,
              "process_payload",
              None,
          )

          if callable(process_payload):
              try:
                  processed = process_payload(payload)

                  if processed is None:
                      print("process_payload(): returned None")
                  elif isinstance(processed, list):
                      print(
                          f"process_payload(): returned "
                          f"{len(processed)} records"
                      )
                  else:
                      print(
                          "process_payload(): returned "
                          f"{type(processed).__name__}"
                      )

              except Exception as exc:
                  print(
                      "process_payload(): ERROR "
                      f"{type(exc).__name__}: {exc}"
                  )
          else:
              print("process_payload(): not available")

          # ------------------------------------------------------------------
          # Final summary
          # ------------------------------------------------------------------

          print("\n" + "=" * 80)
          print("FINAL SUMMARY")
          print("=" * 80)

          print(f"API request:              SUCCESS")
          print(f"Raw records extracted:    {len(raw_records)}")
          print(f"Individual parses OK:     {successful}")
          print(f"Individual parses failed: {failed}")

          if missing_counts:
              print("\nMissing parsed fields:")
              for field, count in sorted(missing_counts.items()):
                  print(f"  {field}: {count}")

          else:
              print("\nMissing parsed fields:    NONE")

          print("\nProduction importer modified: NO")
          print("Database modified:            NO")
          print("=" * 80)

          # Fail only if we could not extract or parse anything.
          if raw_records and successful == 0:
              print("\nERROR: No raw records could be parsed.")
              sys.exit(1)

          if not raw_records:
              print("\nWARNING: API returned zero raw records.")

          print("\nParser test completed.")
          PY
