name: Test Parser

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run parser comparison test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          import data_processor

          print("=" * 80)
          print("PARSER COMPARISON TEST")
          print("=" * 80)

          # ------------------------------------------------------------
          # Controlled Test 5 API request
          #
          # IMPORTANT:
          # closureType is deliberately NOT supplied.
          # ------------------------------------------------------------

          API_URL = "https://api.data.nationalhighways.co.uk/roads/v2.0/closures"

          START = "2026-08-11T00:00:00"
          END = "2026-08-18T23:59:59"

          API_KEY = os.environ.get("NATIONAL_HIGHWAYS_API_KEY")

          if not API_KEY:
              print("ERROR: NATIONAL_HIGHWAYS_API_KEY is not available.")
              sys.exit(1)

          params = {
              "startDateTime": START,
              "endDateTime": END,
          }

          print(f"Start: {START}")
          print(f"End:   {END}")
          print("closureType: NOT supplied")
          print("Pagination: NOT followed")
          print()

          # ------------------------------------------------------------
          # Make exactly one raw API request.
          # ------------------------------------------------------------

          try:
              response = requests.get(
                  API_URL,
                  params=params,
                  headers={
                      "Ocp-Apim-Subscription-Key": API_KEY,
                      "Accept": "application/json",
                  },
                  timeout=60,
              )
          except Exception as exc:
              print(f"ERROR: API request failed: {exc}")
              sys.exit(1)

          print(f"HTTP status: {response.status_code}")

          if response.status_code != 200:
              print()
              print("ERROR: API request did not return HTTP 200.")
              print(response.text[:2000])
              sys.exit(1)

          # ------------------------------------------------------------
          # Decode the raw D2 payload.
          # ------------------------------------------------------------

          try:
              payload = response.json()
          except Exception as exc:
              print(f"ERROR: Could not decode JSON: {exc}")
              sys.exit(1)

          print("Raw JSON decoded successfully.")
          print(f"Raw payload type: {type(payload).__name__}")

          if not isinstance(payload, dict):
              print("ERROR: Expected D2 payload to be a dictionary.")
              sys.exit(1)

          # ------------------------------------------------------------
          # Inspect the raw record count without dumping the payload.
          # ------------------------------------------------------------

          try:
              raw_records = data_processor.extract_raw_records(payload)
          except Exception as exc:
              print(f"ERROR: extract_raw_records() failed: {exc}")
              sys.exit(1)

          print(f"Raw records identified: {len(raw_records)}")

          if not raw_records:
              print("ERROR: No raw records were found.")
              sys.exit(1)

          # ------------------------------------------------------------
          # Run the ACTUAL production parser.
          #
          # This is the important part:
          #
          # process_data(payload)
          #
          # No API-loading function is required because the API request
          # is performed here and the raw D2 payload is passed directly
          # to the production parser.
          # ------------------------------------------------------------

          print()
          print("Calling data_processor.process_data(payload)...")

          try:
              parsed_records = data_processor.process_data(payload)
          except Exception as exc:
              print()
              print("=" * 80)
              print("PARSER CRASHED")
              print("=" * 80)
              print(f"{type(exc).__name__}: {exc}")
              raise

          if parsed_records is None:
              parsed_records = []

          if not isinstance(parsed_records, list):
              print(
                  "ERROR: process_data() returned "
                  f"{type(parsed_records).__name__}, expected list."
              )
              sys.exit(1)

          print(
              f"Parser returned {len(parsed_records)} parsed records."
          )

          # ------------------------------------------------------------
          # Compact parsed-record output.
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("COMPACT PARSED RECORDS")
          print("=" * 80)

          def first(record, *names):
              for name in names:
                  value = record.get(name)
                  if value not in (None, ""):
                      return value
              return ""

          expected_fields = [
              "id",
              "record_id",
              "idG",
              "road",
              "road_name",
              "roadName",
              "direction",
              "start",
              "start_datetime",
              "end",
              "end_datetime",
              "comment",
              "location",
              "location_description",
          ]

          field_counts = {
              field: 0
              for field in expected_fields
          }

          for index, record in enumerate(parsed_records, start=1):

              if not isinstance(record, dict):
                  print(
                      f"RECORD {index}: "
                      f"INVALID TYPE {type(record).__name__}"
                  )
                  continue

              record_id = first(
                  record,
                  "id",
                  "record_id",
                  "idG",
              )

              road = first(
                  record,
                  "road",
                  "road_name",
                  "roadName",
              )

              direction = first(
                  record,
                  "direction",
              )

              start = first(
                  record,
                  "start",
                  "start_datetime",
              )

              end = first(
                  record,
                  "end",
                  "end_datetime",
              )

              comment = first(
                  record,
                  "comment",
                  "location_description",
                  "location",
              )

              print(
                  f"RECORD {index}: "
                  f"id={record_id} | "
                  f"road={road} | "
                  f"direction={direction} | "
                  f"start={start} | "
                  f"end={end} | "
                  f"comment={str(comment)[:100]}"
              )

              for field in expected_fields:
                  if record.get(field) not in (None, ""):
                      field_counts[field] += 1

          # ------------------------------------------------------------
          # Missing-field report.
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("MISSING-FIELD REPORT")
          print("=" * 80)

          if parsed_records:

              for field in expected_fields:
                  present = field_counts[field]
                  missing = len(parsed_records) - present

                  if missing:
                      print(
                          f"{field}: "
                          f"present={present}, "
                          f"missing={missing}"
                      )

          else:
              print("No parsed records available.")

          # ------------------------------------------------------------
          # Combined semantic checks.
          # ------------------------------------------------------------

          valid_id = 0
          valid_road = 0
          valid_direction = 0
          valid_start_end = 0

          for record in parsed_records:

              if not isinstance(record, dict):
                  continue

              if (
                  record.get("id")
                  or record.get("record_id")
                  or record.get("idG")
              ):
                  valid_id += 1

              if (
                  record.get("road")
                  or record.get("road_name")
                  or record.get("roadName")
              ):
                  valid_road += 1

              if record.get("direction"):
                  valid_direction += 1

              has_start = bool(
                  record.get("start")
                  or record.get("start_datetime")
              )

              has_end = bool(
                  record.get("end")
                  or record.get("end_datetime")
              )

              if has_start and has_end:
                  valid_start_end += 1

          # ------------------------------------------------------------
          # Final totals.
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("FINAL TOTALS")
          print("=" * 80)

          print(f"Raw API records:              {len(raw_records)}")
          print(f"Parsed records:               {len(parsed_records)}")
          print(f"Records with ID:              {valid_id}")
          print(f"Records with road:            {valid_road}")
          print(f"Records with direction:       {valid_direction}")
          print(f"Records with valid start/end: {valid_start_end}")

          print()
          print("=" * 80)
          print("TEST CONDITIONS")
          print("=" * 80)

          print("Successful API request: YES")
          print("closureType supplied: NO")
          print("Pagination followed: NO")
          print("Production importer modified: NO")
          print("Database modified: NO")

          print()
          print("=" * 80)
          print("PARSER COMPARISON COMPLETE")
          print("=" * 80)

          # ------------------------------------------------------------
          # Failure condition.
          #
          # The parser must not silently return zero records when the
          # API supplied records.
          # ------------------------------------------------------------

          if len(raw_records) > 0 and len(parsed_records) == 0:
              print()
              print(
                  "ERROR: API returned records but "
                  "process_data() returned zero parsed records."
              )
              sys.exit(1)

          print("TEST PASSED")
          PY
