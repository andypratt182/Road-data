name: Test Parser - Compact Output

on:
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run parser with compact output
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          print("=" * 80)
          print("PARSER TEST - COMPACT OUTPUT")
          print("=" * 80)
          print()

          # Import the existing production parser.
          try:
              import data_processor
          except Exception:
              print("ERROR: Could not import data_processor.py")
              traceback.print_exc()
              sys.exit(1)

          print("data_processor.py imported successfully.")
          print()

          # ------------------------------------------------------------------
          # Locate the parser entry point without modifying production code.
          # ------------------------------------------------------------------

          candidates = [
              "process_data",
              "process_records",
              "parse_records",
              "parse_data",
              "process_api_data",
              "parse_api_response",
          ]

          parser_function = None

          for name in candidates:
              candidate = getattr(data_processor, name, None)
              if callable(candidate):
                  parser_function = candidate
                  print(f"Parser function found: {name}()")
                  break

          if parser_function is None:
              print("ERROR: Could not identify a parser function in data_processor.py")
              print()
              print("Available functions:")
              for name in dir(data_processor):
                  if callable(getattr(data_processor, name, None)) and not name.startswith("_"):
                      print(f"  {name}")
              sys.exit(1)

          print()

          # ------------------------------------------------------------------
          # Find an existing API/data-loading function if one exists.
          # ------------------------------------------------------------------

          loader_candidates = [
              "fetch_data",
              "fetch_closures",
              "get_closures",
              "download_data",
              "get_data",
              "fetch_api_data",
          ]

          loader = None

          for name in loader_candidates:
              candidate = getattr(data_processor, name, None)
              if callable(candidate):
                  loader = candidate
                  print(f"Data loader found: {name}()")
                  break

          if loader is None:
              print("ERROR: Could not identify an API/data-loading function.")
              print()
              print("Available functions:")
              for name in dir(data_processor):
                  if callable(getattr(data_processor, name, None)) and not name.startswith("_"):
                      print(f"  {name}")
              sys.exit(1)

          print()
          print("-" * 80)
          print("FETCHING TEST DATA")
          print("-" * 80)

          # ------------------------------------------------------------------
          # Call the existing loader.
          #
          # The loader is intentionally isolated here. Nothing is written to
          # the production database and no production output is generated.
          # ------------------------------------------------------------------

          try:
              raw_data = loader()
          except TypeError:
              # Some implementations require the API key explicitly.
              api_key = os.environ.get("NATIONAL_HIGHWAYS_API_KEY")

              if not api_key:
                  print("ERROR: Loader requires an argument and no API key was available.")
                  raise

              raw_data = loader(api_key)

          except Exception:
              print("ERROR: API/data loading failed.")
              traceback.print_exc()
              sys.exit(1)

          # ------------------------------------------------------------------
          # Normalise the top-level API response purely for this test.
          # ------------------------------------------------------------------

          if isinstance(raw_data, dict):
              records = (
                  raw_data.get("D2Payload")
                  or raw_data.get("d2Payload")
                  or raw_data.get("records")
                  or raw_data.get("closures")
                  or raw_data.get("data")
                  or []
              )

              if isinstance(records, dict):
                  records = (
                      records.get("situationRecord")
                      or records.get("records")
                      or records.get("items")
                      or []
                  )
          elif isinstance(raw_data, list):
              records = raw_data
          else:
              records = []

          if not isinstance(records, list):
              records = list(records) if records else []

          print(f"Raw records available to parser: {len(records)}")
          print()

          # ------------------------------------------------------------------
          # Run parser.
          # ------------------------------------------------------------------

          try:
              parsed = parser_function(records)
          except TypeError:
              # Some parsers may expect the entire API payload instead.
              try:
                  parsed = parser_function(raw_data)
              except Exception:
                  print("ERROR: Parser failed.")
                  traceback.print_exc()
                  sys.exit(1)
          except Exception:
              print("ERROR: Parser failed.")
              traceback.print_exc()
              sys.exit(1)

          if parsed is None:
              parsed_records = []
          elif isinstance(parsed, list):
              parsed_records = parsed
          else:
              parsed_records = [parsed]

          print("-" * 80)
          print("PARSER RESULTS")
          print("-" * 80)
          print()

          print(f"Raw records:    {len(records)}")
          print(f"Parsed records: {len(parsed_records)}")
          print()

          # ------------------------------------------------------------------
          # Compact record reporting.
          # ------------------------------------------------------------------

          missing = []

          def get_value(obj, *keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  if key in obj and obj[key] not in (None, ""):
                      return obj[key]

              return None

          def first_value(obj, *keys):
              value = get_value(obj, *keys)

              if isinstance(value, dict):
                  for key in ("value", "name", "roadName", "description"):
                      if value.get(key) not in (None, ""):
                          return value[key]

              return value

          for index, record in enumerate(parsed_records, start=1):

              if not isinstance(record, dict):
                  print(f"{index:02d}. NON-DICT RESULT: {type(record).__name__}")
                  continue

              road = first_value(
                  record,
                  "roadName",
                  "road",
                  "road_number",
                  "roadNumber",
              )

              direction = first_value(
                  record,
                  "direction",
                  "directionOfTravel",
              )

              management = first_value(
                  record,
                  "managementType",
                  "roadOrCarriagewayOrLaneManagementType",
                  "type",
              )

              start = first_value(
                  record,
                  "start",
                  "startTime",
                  "overallStartTime",
                  "startDateTime",
              )

              end = first_value(
                  record,
                  "end",
                  "endTime",
                  "overallEndTime",
                  "endDateTime",
              )

              comment = first_value(
                  record,
                  "comment",
                  "description",
                  "locationDescription",
                  "generalPublicComment",
              )

              road_display = road or "MISSING"
              direction_display = direction or "MISSING"
              management_display = management or "MISSING"
              start_display = start or "MISSING"
              end_display = end or "MISSING"

              print(
                  f"{index:02d}. "
                  f"{road_display} | "
                  f"{direction_display} | "
                  f"{management_display} | "
                  f"{start_display} -> {end_display}"
              )

              missing_fields = []

              if not road:
                  missing_fields.append("road")
              if not direction:
                  missing_fields.append("direction")
              if not start:
                  missing_fields.append("start")
              if not end:
                  missing_fields.append("end")

              if missing_fields:
                  missing.append((index, missing_fields, comment))

          # ------------------------------------------------------------------
          # Missing-field report.
          # ------------------------------------------------------------------

          print()
          print("-" * 80)
          print("MISSING / INCOMPLETE PARSED FIELDS")
          print("-" * 80)
          print()

          if missing:
              for index, fields, comment in missing:
                  print(
                      f"{index:02d}. Missing: {', '.join(fields)}"
                  )
                  if comment:
                      print(f"    Comment: {comment}")
          else:
              print("None.")

          # ------------------------------------------------------------------
          # Parser object shape.
          # ------------------------------------------------------------------

          print()
          print("-" * 80)
          print("FIRST PARSED RECORD STRUCTURE")
          print("-" * 80)
          print()

          if parsed_records:
              first = parsed_records[0]

              if isinstance(first, dict):
                  print("Keys:")
                  for key in sorted(first.keys()):
                      value = first[key]

                      if isinstance(value, (dict, list)):
                          print(f"  {key}: {type(value).__name__}")
                      else:
                          print(f"  {key}: {value}")
              else:
                  print(type(first).__name__)

          # ------------------------------------------------------------------
          # Final result.
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("PARSER TEST SUMMARY")
          print("=" * 80)
          print(f"Raw records available: {len(records)}")
          print(f"Parsed records:        {len(parsed_records)}")
          print(f"Records with missing fields: {len(missing)}")
          print()

          if not parsed_records and records:
              print("RESULT: FAIL - parser returned no records.")
              sys.exit(1)

          print("RESULT: PASS - parser executed successfully.")
          print("=" * 80)
          PY
