name: Test National Highways API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
          NATIONAL_HIGHWAYS_API_BASE_URL: https://api.data.nationalhighways.co.uk/roads/v2.0
        run: |
          python test_api.py

      - name: Test Flask application
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python -c "from app import app; print('Flask application imported successfully')"
          
      - name: Test Flask homepage
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          response = client.get("/")

          print("HTTP status:", response.status_code)

          if response.status_code != 200:
              print(response.data.decode("utf-8", errors="replace"))
              raise SystemExit(1)

          print("Flask homepage loaded successfully")
          PY
       - name: Test Flask filters
         env:
            NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
          run: |
            python - <<'PY'
            from app import app

            client = app.test_client()

            tests = [
                ("/?road=M6", "M6 road filter"),
                ("/?road=M1", "M1 road filter"),
                ("/?road=M62", "M62 road filter"),
                ("/?direction=northbound", "Northbound filter"),
                ("/?status=active", "Active status filter"),
                ]

            for url, name in tests:
                response = client.get(url)
                
                print(f"{name}: HTTP {response.status_code}")

        if response.status_code != 200:
            print(response.data.decode("utf-8", errors="replace"))
            raise SystemExit(1)

            print("All Flask filters loaded successfully")
            PY
