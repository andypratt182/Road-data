name: Test Road Data

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test API
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python test_api.py

      - name: Test Flask application
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python -c "from app import app; print('Flask application imported successfully')"

      - name: Test Flask homepage
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python -c "from app import app; response = app.test_client().get('/'); print('HTTP status:', response.status_code); raise SystemExit(0 if response.status_code == 200 else 1)"

      - name: Test Flask filters
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
        run: |
          python -c "from app import app; client = app.test_client(); tests = ['/ ?road=M6', '/?road=M1', '/?road=M62', '/?direction=northbound', '/?status=active']; tests = [url.replace('/ ?', '/?') for url in tests]; results = [(url, client.get(url).status_code) for url in tests]; print(*results, sep='\n'); raise SystemExit(0 if all(status == 200 for _, status in results) else 1)"
