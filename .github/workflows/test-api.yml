name: Test National Highways API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API test
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
          NATIONAL_HIGHWAYS_API_BASE_URL: https://api.data.nationalhighways.co.uk/roads/v2.0
        run: |
          python test_api.py

      - name: Test Flask application
        run: |
          python -c "from app import app; print('Flask application imported successfully')"
